<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pass the Phone</title>
<meta name="description" content="Secret Santa and party games for one phone passed around the room.">
<meta name="theme-color" content="#F2F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1F1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pass the Phone">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --tint:#E3EDE9; --ink:#12332B; --muted:#55706A;
  --line:#CFDCD6; --accent:#C4202A; --on-accent:#FFFFFF; --green:#17694C; --gold:#D99A1C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1F1A; --surface:#162E27; --tint:#1E3B33; --ink:#EAF3EF; --muted:#9FB7AF;
    --line:#2D4A41; --accent:#F2676C; --on-accent:#23070A; --green:#5AD0A4; --gold:#F0BC4A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:19px; line-height:1.45; -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
}
#app{max-width:540px; margin:0 auto; padding:0 18px calc(28px + env(safe-area-inset-bottom));}
h1,h2,p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 0 14px;}
.top h1{font-size:1.45rem; font-weight:800; letter-spacing:-.01em; flex:1}
.back{min-width:52px; height:52px; padding:0 14px; border-radius:26px; border:2px solid var(--line); background:var(--surface); font-size:1.05rem; font-weight:700}
.back.arrow{font-size:1.7rem; line-height:1; padding:0 0 4px}
.hero{padding:calc(34px + env(safe-area-inset-top)) 0 22px}
.hero h1{font-size:2.5rem; line-height:1.05; font-weight:800; letter-spacing:-.02em}
.hero p{color:var(--muted); margin-top:10px; max-width:22em}

main{display:flex; flex-direction:column; gap:16px}
section{display:flex; flex-direction:column; gap:12px; padding-top:18px; border-top:2px solid var(--line)}
section:first-child{border-top:0; padding-top:0}
h2{font-size:1.15rem; font-weight:800}
.lead{font-size:1.15rem}
.muted{color:var(--muted); font-size:.95rem}
.err{color:var(--accent); font-weight:700}
strong{font-weight:800}

/* buttons */
.btn{
  display:flex; align-items:center; justify-content:center; text-align:center; width:100%; min-height:60px; padding:12px 20px;
  border-radius:16px; border:2px solid var(--accent); background:var(--accent); color:var(--on-accent);
  font-size:1.15rem; font-weight:800;
}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--surface); color:var(--ink); border-color:var(--ink)}
.btn.quiet{background:transparent; color:var(--ink); border-color:transparent; text-decoration:underline; text-underline-offset:4px; min-height:52px; font-weight:700}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* home menu */
.menu{display:flex; flex-direction:column; gap:12px}
.menu h2{margin-top:14px}
.game{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; width:100%; text-align:left;
  padding:16px 18px; min-height:84px; border-radius:20px; border:2px solid var(--line); background:var(--surface);
}
.game b{display:block; font-size:1.3rem; font-weight:800}
.game span{display:block; color:var(--muted); font-size:.95rem}
.game i{font-style:normal; font-size:2.1rem}
.game.main{background:var(--accent); border-color:var(--accent); color:var(--on-accent); min-height:104px}
.game.main span{color:inherit; opacity:.9}
.game:active{transform:translateY(1px)}

/* lists */
.list{display:flex; flex-direction:column; border:2px solid var(--line); border-radius:18px; overflow:hidden; background:var(--surface)}
.row{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:62px; padding:10px 16px;
  background:transparent; border:0; border-top:2px solid var(--line); text-align:left; font-size:1.15rem; font-weight:700;
}
.row:first-child{border-top:0}
.row .st{font-size:.95rem; font-weight:600; color:var(--muted); text-align:right}
.row .st strong{color:var(--ink); font-size:1.1rem}
.row:disabled{opacity:1; cursor:default}
.row:disabled > span:first-child{color:var(--muted)}
.row:disabled .st{color:var(--green)}
.row.out > span:first-child{text-decoration:line-through; color:var(--muted)}
.acts{display:flex; gap:8px}
.mini{min-height:46px; min-width:46px; padding:0 14px; border-radius:23px; border:2px solid var(--line); background:transparent; font-size:.95rem; font-weight:700; color:var(--muted)}
.mini.on{background:var(--green); border-color:var(--green); color:var(--bg)}
.mini.x{padding:0}

/* inputs */
input[type=text],input:not([type]),select{
  width:100%; min-height:58px; padding:10px 16px; border-radius:16px; border:2px solid var(--line); background:var(--surface); font-size:1.1rem;
}
.add{display:grid; grid-template-columns:1fr auto; gap:10px}
.add .btn{width:auto; min-height:58px}
.money{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px; font-size:1.3rem; font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{min-height:52px; padding:8px 18px; border-radius:26px; border:2px solid var(--line); background:var(--surface); font-size:1.05rem; font-weight:700; color:var(--muted)}
.chip.on{background:var(--green); border-color:var(--green); color:var(--bg)}
.chip.on::before{content:"✓ "}
.seg{display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--ink); border-radius:16px; overflow:hidden}
.seg button{min-height:56px; border:0; background:var(--surface); font-size:1.1rem; font-weight:800}
.seg button.on{background:var(--ink); color:var(--bg)}
label.field{display:flex; flex-direction:column; gap:6px; font-weight:700}

/* handoff and reveal */
.handoff,.reveal,.center{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:18px 0 6px}
.big{font-size:2.6rem; line-height:1.1; font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere}
.big.sm{font-size:1.75rem}
.huge{font-size:3.4rem; line-height:1.05; font-weight:800; overflow-wrap:anywhere}
.tag{display:inline-block; padding:6px 16px; border-radius:20px; background:var(--tint); font-weight:800}
main>.tag{align-self:flex-start}
.tag.bad{background:var(--accent); color:var(--on-accent)}
.tag.good{background:var(--green); color:var(--bg)}
.hold{
  position:relative; width:210px; height:210px; border-radius:50%; border:0; margin:10px 0; background:var(--accent); color:var(--on-accent);
  font-size:1.25rem; font-weight:800; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.hold em{font-style:normal; font-size:2.6rem; line-height:1}
.hold svg{position:absolute; inset:-12px; width:calc(100% + 24px); height:calc(100% + 24px); transform:rotate(-90deg); pointer-events:none}
.hold circle{fill:none; stroke-width:5}
.hold .trk{stroke:var(--line)}
.hold .rng{stroke:var(--gold); stroke-linecap:round; stroke-dasharray:302; stroke-dashoffset:302; transition:stroke-dashoffset .2s}
.hold.on{transform:scale(.97)}
.hold.on .rng{stroke-dashoffset:0; transition:stroke-dashoffset .9s linear}
.hold.small{width:150px; height:150px; font-size:1rem}

/* pin */
.dots{display:flex; gap:16px}
.dots i{width:22px; height:22px; border-radius:50%; border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pad{display:grid; grid-template-columns:repeat(3,84px); gap:14px; justify-content:center}
.pad button{height:84px; border-radius:50%; border:2px solid var(--line); background:var(--surface); font-size:1.8rem; font-weight:800}
.pad button:active{background:var(--tint)}

/* presents */
.gifts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.gift{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:92px; padding:8px 4px;
  border-radius:16px; border:2px solid var(--line); background:var(--surface); color:var(--ink);
}
.gift b{font-size:2.3rem; line-height:1.1; font-weight:400}
.gift span{font-size:.85rem; font-weight:700; text-align:center; line-height:1.2}
.gift b svg{display:block; width:2.5rem; height:3.1rem}
.huge svg{width:5.5rem; height:6.9rem}
.seg.four button:nth-child(n+3){border-top:2px solid var(--ink)}
button.gift.on{border-color:var(--gold); background:var(--tint); box-shadow:0 0 0 3px var(--gold)}

.nums{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.nums button{min-height:58px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums}
.nums button.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.nums button:disabled{opacity:.3; text-decoration:line-through; cursor:default}

.bld{background:#2A3442; border-top:12px solid #19202A; border-radius:16px 16px 6px 6px; padding:16px 14px 0}
.wins{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:10px}
.win{position:relative; aspect-ratio:5/6; padding:0; border:3px solid #C9D2DC; border-radius:6px; background:#141C26; overflow:hidden; display:block}
.win.lit{background:#F3CF73} .win.cool{background:#A9D3E0} .win.dim{background:#8A6B3C}
.win::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(#C9D2DC,#C9D2DC) center/3px 100% no-repeat, linear-gradient(#C9D2DC,#C9D2DC) center/100% 3px no-repeat}
.win .cl,.win .cr{position:absolute; top:0; bottom:0; width:27%; background:#A8475A}
.win .cl{left:0} .win .cr{right:0}
.win em{position:absolute; left:0; right:0; bottom:2px; text-align:center; font-style:normal; font-size:1.15rem; line-height:1}
.win svg{position:absolute; left:15%; width:70%; bottom:0; height:auto}
.win svg.h{left:0; top:0; bottom:auto; width:100%; height:100%}
.win .bl{animation:blink 5s infinite; animation-delay:var(--d)}
.win .sw{animation:sway 4s ease-in-out infinite; animation-delay:var(--d)}
.win .gl{position:absolute; left:40%; top:42%; width:5px; height:5px; border-radius:50%; background:#fff; opacity:0; animation:glint 7s infinite; animation-delay:var(--d)}
.win.tw .cr{animation:twitch 8s infinite; animation-delay:var(--d)}
.win.flick{animation:flick 3.4s infinite; animation-delay:var(--d)}
.win.on{box-shadow:0 0 0 4px var(--gold); background:#3B4B5F}
.win.open{background:#0B1017; border-style:dashed; opacity:.9}
.win.open::after{display:none}
.win:disabled{cursor:default}
.door{width:48px; height:52px; margin:16px auto 0; background:#6B4A32; border:3px solid #C9D2DC; border-bottom:0; border-radius:6px 6px 0 0}
.peek{width:150px; aspect-ratio:5/6; position:relative; border:4px solid #C9D2DC; border-radius:8px; background:#0B1017; display:flex; align-items:center; justify-content:center; font-size:4rem}
.peek svg{width:80%; height:auto}
@keyframes blink{0%,88%,100%{opacity:1} 92%{opacity:0}}
@keyframes sway{0%,100%{transform:translateX(-2px)} 50%{transform:translateX(2px)}}
@keyframes glint{0%,90%,100%{opacity:0} 94%{opacity:.8}}
@keyframes twitch{0%,91%,100%{transform:none} 95%{transform:translateX(-3px)}}
@keyframes flick{0%,38%,50%,58%,100%{background:#F3CF73} 42%,54%{background:#141C26}}
@media (prefers-reduced-motion: reduce){.win .gl{animation:none; opacity:.35} .win.flick,.win .bl,.win .sw{animation:none}}

.grid{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:6px}
.gc{aspect-ratio:1; padding:0; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-weight:800; line-height:1;
  font-size:clamp(1rem, calc(56vw / var(--c)), 3.4rem); display:flex; align-items:center; justify-content:center}
.gc.p0{color:var(--accent)} .gc.p1{color:var(--green)}
.grid.four{background:var(--tint); padding:8px; border-radius:16px}
.grid.four .gc{border-radius:50%}
.grid.four .gc.p0{background:var(--accent); border-color:var(--accent)}
.grid.four .gc.p1{background:var(--gold); border-color:var(--gold)}
.gc.hit{box-shadow:0 0 0 4px var(--ink)}
.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.card{aspect-ratio:3/4; padding:0; border:2px solid var(--ink); border-radius:12px; background:var(--ink); color:var(--bg); font-size:2rem; font-weight:800; display:flex; align-items:center; justify-content:center}
.card.up{background:var(--surface); border-color:var(--line); font-size:2.4rem}
.card.gone{background:var(--tint); border-color:var(--tint); opacity:.45}
.word{display:flex; flex-wrap:wrap; gap:6px 6px; justify-content:center; font-size:1.9rem; font-weight:800; line-height:1.2}
.word span{min-width:1.05em; text-align:center; border-bottom:3px solid var(--ink)}
.word span.sp{border:0; min-width:.7em}
.keys{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.keys button{min-height:52px; padding:0; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-size:1.2rem; font-weight:800}
.keys button.ok{background:var(--green); border-color:var(--green); color:var(--bg); opacity:1}
.keys button:disabled{opacity:.3; cursor:default}
.keys button.ok:disabled{opacity:1}
.snow{width:150px; height:180px}
.snow *{fill:var(--surface); stroke:var(--ink); stroke-width:3; stroke-linecap:round}
.snow .dk{fill:var(--ink)} .snow .nose{fill:#EE7F2D; stroke:none}

.sky{position:relative; height:52vh; min-height:330px; border-radius:18px; overflow:hidden; display:grid; grid-template-columns:repeat(var(--c),1fr);
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%), radial-gradient(1.5px 1.5px at 67% 9%,#fff 50%,transparent 51%), radial-gradient(1px 1px at 38% 30%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 85% 36%,#fff 50%,transparent 51%), radial-gradient(1px 1px at 24% 52%,#fff 50%,transparent 51%), linear-gradient(#090D22,#1D2756)}
.lane{position:relative; border-left:1px dashed rgba(255,255,255,.12)}
.lane:first-child{border-left:0}
.rocket{position:absolute; left:50%; bottom:0; margin-left:-.85rem; font-size:1.7rem; line-height:1; transform:rotate(-45deg)}
.burst{position:absolute; left:50%; width:6px; height:6px; margin:0 0 -3px -3px; border-radius:50%; background:currentColor; color:var(--pc); animation:boom .7s ease-out both;
  box-shadow:0 -30px, 15px -26px, 26px -15px, 30px 0, 26px 15px, 15px 26px, 0 30px, -15px 26px, -26px 15px, -30px 0, -26px -15px, -15px -26px,
    0 -16px, 11px -11px, 16px 0, 11px 11px, 0 16px, -11px 11px, -16px 0, -11px -11px}
.lane .alt{position:absolute; left:0; right:0; margin-bottom:-56px; text-align:center; color:#fff; font-size:.8rem; font-weight:800}
@keyframes boom{from{transform:scale(.1); opacity:1} to{transform:scale(1); opacity:.9}}
.pads{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:8px}
.pad2{min-height:64px; padding:6px 4px; border-radius:14px; border:3px solid var(--pc); background:var(--surface); font-weight:800; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; touch-action:manipulation}
.pads.big .pad2{min-height:110px; font-size:1.25rem; background:var(--pc); color:#10161E}
.pad2:disabled{opacity:.35}
.sig{min-height:150px; border-radius:18px; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; font-size:2.2rem; font-weight:800; background:var(--tint)}
.sig.wait{background:#7A1C22; color:#fff} .sig.fake{background:#D99A1C; color:#10161E} .sig.go{background:#1F9D5B; color:#fff}
.balloonbox{height:280px; display:flex; align-items:center; justify-content:center}
.balloon{font-size:calc(2.6rem * var(--s)); line-height:1; transition:font-size .25s}
.three{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}

/* clock and scores */
.clock{display:flex; flex-direction:column; gap:12px; align-items:stretch; text-align:center}
#clock{font-size:4.2rem; line-height:1; font-weight:800; font-variant-numeric:tabular-nums; padding:8px 0}
.clock.done #clock{color:var(--accent)}
.board{width:100%; border-collapse:collapse; font-size:1.1rem}
.board td{padding:10px 4px; border-top:2px solid var(--line)}
.board tr:first-child td{border-top:0}
.board td:last-child{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
.ver{color:var(--muted); font-size:.8rem; text-align:center; opacity:.8}
ol.steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:8px}
#toast{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:88vw;
  background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:26px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

// Everyone gives to the next person in one random loop, so nobody can draw themselves.
function drawPairs(names){
  const r = names.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = rnd(i); [r[i], r[j]] = [r[j], r[i]]; }
  return names.map((g, i) => ({g, r: r[i]}));
}

  if (!unlocked) return V.santa();
  const s = S.santa;
  const year = new Date().getFullYear();
  let nm = `Christmas ${year}`, k = 2;
  while (s.draws.some(d => d.name === nm)) nm = `Christmas ${year} (${k++})`;
  let h = `<section><h2>People</h2>` +
    (s.people.length ? `<div class="list">${s.people.map((p, i) => `<div class="row"><span>${esc(p.name)}</span><span class="acts">` +
      `<button class="mini${p.admin ? ' on' : ''}" data-act="togAdmin" data-i="${i}" aria-pressed="${!!p.admin}">Admin</button>` +
      `<button class="mini x" data-act="delPerson" data-i="${i}" aria-label="Remove ${esc(p.name)}">✕</button></span></div>`).join('')}</div>`
      : `<p class="muted">Nobody yet. Add at least three people.</p>`) +
    `<div class="add"><input id="newName" type="text" maxlength="20" placeholder="Add a name" autocomplete="off" enterkeyhint="done" data-enter="addPerson" aria-label="Name to add"><button class="btn alt" data-act="addPerson">Add</button></div>` +
    `<p class="muted">Tick Admin for the people who know the PIN. In the full list, whoever is buying for an admin stays hidden unless tapped, so admins keep their own surprise.</p></section>`;
  h += `<section><h2>Spend limit</h2><label class="money"><span>$</span><input id="limit" type="text" inputmode="decimal" maxlength="8" placeholder="50" value="${esc(s.limit)}" data-chg="limit" aria-label="Spend limit in dollars"></label>` +
    `<p class="muted">The same for everyone. It shows on each person's reveal.</p></section>`;
  h += `<section><h2>New draw</h2><input id="drawName" type="text" maxlength="30" value="${esc(nm)}" aria-label="Name for this draw">` +
    `<button class="btn" data-act="runDraw" ${s.people.length < 3 ? 'disabled' : ''}>Draw names</button>` +
    (s.draws.length ? `<p class="muted">A new draw becomes the one people reveal. Earlier draws stay in the list below.</p>` : '') + `</section>`;
  h += `<section><h2>Draws</h2>` + (s.draws.length
    ? `<div class="list">${s.draws.map((d, i) => `<button class="row" data-act="openDraw" data-i="${i}"><span>${esc(d.name)}</span><span class="st">${fmtDate(d.date)}${i === 0 ? '<br>Current' : ''}</span></button>`).join('')}</div>`
    : `<p class="muted">Nothing drawn yet.</p>`) + `</section>`;
  h += `<section><h2>Backup</h2><p class="muted">Draws are saved in this phone's browser. A backup file is a copy you can keep in Files or email to yourself, and restore later.</p>` +
    `<button class="btn alt" data-act="export">Save a backup file</button>` +
    `<label class="btn alt">Restore from a backup file<input class="vh" type="file" accept=".json,application/json" data-chg="import"></label></section>`;
  h += `<section><h2>PIN and reset</h2><button class="btn alt" data-act="changePin">Change the PIN</button>` +
    `<button class="btn quiet danger" data-act="erase" data-confirm="Tap again to erase everything">Erase everything on this phone</button></section>`;
  return page('Admin', h, 'santa');
};

V.draw = () => {
  if (!unlocked) return V.santa();
  const d = S.santa.draws[view.i];
  if (!d) return V.admin();
  const open = view.open || [];
  let h = `<p class="lead"><strong>${esc(d.name)}</strong></p><p class="muted">Drawn ${fmtDate(d.date)}${d.limit ? `, spend up to $${esc(d.limit)}` : ''}</p>` +
    `<div class="list">${d.pairs.map((p, i) => { const on = open.includes(i);
      return `<button class="row" data-act="peek" data-i="${i}" aria-expanded="${on}"><span>${esc(p.g)}</span><span class="st">${on ? `buys for <strong>${esc(p.r)}</strong>` : 'Tap to show'}</span></button>`; }).join('')}</div>` +
    `<div class="pair"><button class="btn alt" data-act="showAll">Show all</button><button class="btn alt" data-act="hideAll">Hide all</button></div>` +
    `<p class="muted">Show all leaves out whoever is buying for an admin. Tap a row to see it anyway.</p>`;
  if (d.seen.length) h += `<section><h2>Let someone look again</h2><p class="muted">Tap a name to unlock it on the reveal screen.</p>` +
    `<div class="chips">${d.seen.map((n, i) => `<button class="chip" data-act="unsee" data-i="${i}">${esc(n)}</button>`).join('')}</div></section>`;
  h += `<section><button class="btn quiet danger" data-act="delDraw" data-confirm="Tap again to delete this draw">Delete this draw</button></section>`;
  return page('Full list', h, 'admin');
};

/* Game setup */
V.setup = () => {
  const g = GAMES[view.game], p = pool(), sel = selected();
  let h = `<section><h2>Who is playing?</h2>` +
    (p.length ? `<div class="chips">${p.map((n, i) => `<button class="chip${sel.includes(n) ? ' on' : ''}" data-act="tog" data-i="${i}" aria-pressed="${sel.includes(n)}">${esc(n)}</button>`).join('')}</div>`
      : `<p class="muted">Add the name of everyone playing.</p>`) +
    `<div class="add"><input id="newName" type="text" maxlength="20" placeholder="Add a name" autocomplete="off" enterkeyhint="done" data-enter="addExtra" aria-label="Name to add"><button class="btn alt" data-act="addExtra">Add</button></div>` +
    (p.length ? `<p class="muted">${sel.length} playing. Tap a name to add or drop it for this game.</p>` : '') +
    (S.lastPlayers.length ? `<button class="btn alt" data-act="sameAgain">Use the same players as last game</button>` : '') +
    (S.extras.length ? `<button class="btn quiet" data-act="clearExtras" data-confirm="Tap again to remove the extra names">Remove the extra names</button>` : '') + `</section>`;
  if (g.lv) h += `<section><h2>Level</h2><div class="seg"><button class="${S.level === 'easy' ? 'on' : ''}" data-act="level" data-l="easy" aria-pressed="${S.level === 'easy'}">Easy</button>` +
    `<button class="${S.level === 'hard' ? 'on' : ''}" data-act="level" data-l="hard" aria-pressed="${S.level === 'hard'}">Hard</button></div>` +
    `<p class="muted">${g.lv[S.level === 'easy' ? 0 : 1]}. Easy suits the youngest players.</p></section>`;
  if (view.game === 'grinch') h += `<section><h2>Version</h2><div class="seg four">${Object.keys(THEMES).map(k => `<button class="${S.theme === k ? 'on' : ''}" data-act="theme" data-k="${k}" aria-pressed="${S.theme === k}">${THEMES[k].t}</button>`).join('')}</div>` +
    `<p class="muted">${(t => `${t.Crew} guard what is ${t.place}. One of them is secretly ${t.thief}.`)(THEMES[S.theme])}</p></section>`;
  if (view.game === 'imp' || view.game === 'char' || view.game === 'hang') h += `<section><h2>Category</h2><select data-chg="cat" aria-label="Category"><option value="any">Any category</option>` +
    Object.keys(WORDS).map(c => `<option${S.cat === c ? ' selected' : ''}>${esc(c)}</option>`).join('') + `</select></section>`;
  if (view.game === 'imp' || view.game === 'wolf' || view.game === 'spy') h += `<section><h2>Discussion timer</h2><select data-chg="timer" aria-label="Discussion timer">` +
    [60,120,180,300].map(t => `<option value="${t}"${S.timer === t ? ' selected' : ''}>${t / 60} minute${t > 60 ? 's' : ''}</option>`).join('') + `</select></section>`;
  const over = g.max && sel.length > g.max;
  h += `<section><button class="btn" data-act="start" ${sel.length < g.min || over ? 'disabled' : ''}>Start</button>` +
    (sel.length < g.min ? `<p class="muted">This game needs at least ${g.min} players.</p>` : over ? `<p class="muted">This game takes up to ${g.max} players. Tap a name to drop it.</p>` : '') + `</section>`;
  return page(view.game === 'grinch' ? THEMES[S.theme].name : g.t, h);
};

/* Pass the phone, hold to reveal */
V.pass = () => {
  const c = G.cards[view.i], many = G.cards.length > 1;
  const body = view.shown
    ? `<div class="reveal">${typeof c.html === 'function' ? c.html() : c.html}</div>` +
      `<button class="btn" id="passBtn" data-act="passNext" ${G.type === 'grinch' && view.pick == null ? 'disabled' : ''}>Hide and pass on</button>`
    : `<div class="handoff"><p class="lead">Hand the phone to</p><p class="big">${esc(c.name)}</p>${holdBtn('Hold to reveal')}` +
      `<p class="muted">Only ${esc(c.name)} should be looking.${many ? ` Player ${view.i + 1} of ${G.cards.length}.` : ''}</p></div>`;
  return G.type === 'santa' ? page('Secret Santa', body, 'santa') : page(G.th ? G.th.name : GAMES[G.type].t, body, 'home', true);
};

/* Imposter and Spot the spy share these */
V.impTalk = () => page(G.L.t, `<div class="center"><p class="tag">${esc(G.starter)} starts</p><p class="lead">${G.L.talk}</p></div>` +
  clock() + `<button class="btn" data-act="nav" data-to="impVote">Time to vote</button>` +
  (G.L.list ? `<section><h2>Possible places</h2><p class="muted">${G.L.list.map(esc).join(', ')}</p></section>` : ''), 'home', true);

V.impVote = () => page(G.L.t, `<p class="lead">Count to three and all point. Who got the most votes?</p>` +
  `<div class="list">${G.players.map((n, i) => `<button class="row" data-act="impVoted" data-i="${i}"><span>${esc(n)}</span></button>`).join('')}</div>`, 'home', true);

V.impResult = () => {
  const imp = G.players[G.imp], caught = view.vote === G.imp;
  return page(G.L.t, `<div class="center"><p class="tag ${caught ? 'good' : 'bad'}">${caught ? 'Caught' : 'Got away with it'}</p>` +
    `<p class="lead">The ${G.L.who} was</p><p class="big">${esc(imp)}</p><p class="lead">${G.L.secret} was <strong>${esc(G.word)}</strong></p>` +
    `<p class="muted">${caught ? 'Everyone else gets a point.' : `${esc(imp)} gets two points.`}</p></div>` +
    againBtns(G.type) + board(G.L.key));
};

/* Grinch */
const shelfHTML = (items, pickable) => `<div class="gifts">${items.map((g, k) => pickable
  ? `<button class="gift${view.pick === k ? ' on' : ''}" data-act="${pickable}" data-k="${k}"><b aria-hidden="true">${g[0]}</b><span>${g[1]}</span></button>`
  : `<div class="gift"><b aria-hidden="true">${g[0]}</b><span>${g[1]}</span></div>`).join('')}</div>`;

V.grMem = () => page(G.th.name, `<div class="center"><p class="lead">Everyone look. Remember what is ${G.th.place}.</p><div id="clock" role="timer">${mmss(view.left)}</div></div>` +
  shelfHTML(G.shelf) + `<button class="btn" data-act="grReady">We are ready</button>`, 'home', true);

V.grGuess = () => page(G.th.name, `<p class="lead">${G.th.Crew}, one ${G.th.thing} has gone. Here is what is left ${G.th.place}.</p>` + shelfHTML(G.rem) +
  `<section><h2>Which ${G.th.thing} is missing?</h2>${shelfHTML(G.opts, 'grPick')}</section>`, 'home', true);

V.grWho = () => page(G.th.name, `<p class="lead">Now, who is ${G.th.thief}? Count to three and all point.</p>` +
  `<div class="list">${G.players.map((n, i) => `<button class="row" data-act="grAccuse" data-i="${i}"><span>${esc(n)}</span></button>`).join('')}</div>`, 'home', true);

V.grResult = () => {
  const t = G.th, st = G.shelf[G.stolen], who = G.players[G.grinch], ty = S.tally[G.key] || {c:0, t:0}, cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  return page(t.name, `<div class="center"><p class="lead">${cap(t.thief)} stole</p><p class="huge">${st[0]}</p><p class="big sm">${esc(st[1])}</p>` +
    `<p class="tag ${G.okGift ? 'good' : 'bad'}">${G.okGift ? `The ${t.Crew.toLowerCase()} spotted it` : `The guess was ${esc(G.opts[G.guess][1])}`}</p>` +
    `<p class="lead">${cap(t.thief)} was <strong>${esc(who)}</strong></p>` +
    `<p class="tag ${G.okWho ? 'good' : 'bad'}">${G.okWho ? t.caught : `${esc(G.players[G.accused])} got the blame`}</p></div>` +
    `<section><h2>Running score</h2><table class="board"><tr><td>${t.Crew}</td><td>${ty.c}</td></tr><tr><td>${t.Thief}</td><td>${ty.t}</td></tr></table>` +
    `<p class="muted">${t.Crew} score for each right answer. ${cap(t.thief)} scores for each wrong one.</p>` +
    `<button class="btn quiet" data-act="resetTally" data-confirm="Tap again to clear the score">Clear the score</button></section>` + againBtns('grinch'));
};

/* Werewolf */
V.wolf = () => {
  const alive = G.players.filter((_, i) => !G.out.includes(i));
  const wolves = G.players.filter((_, i) => !G.out.includes(i) && G.roles[i] === 'wolf').length;
  const others = alive.length - wolves;
  const win = wolves === 0 ? 'The villagers win' : wolves >= others ? 'The werewolves win' : '';
  const hard = G.roles.includes('seer');
  const steps = ['Everyone closes their eyes.', '"Werewolves, wake up and point at one villager." Then they sleep again.'];
  if (hard) steps.push('"Seer, wake up and point at one player." Nod if that player is a werewolf.');
  if (G.roles.includes('doctor')) steps.push('"Doctor, wake up and point at one player to protect."');
  steps.push('"Everyone wake up." Say who was caught in the night and tap their name below.' + (G.roles.includes('doctor') ? ' Nobody is caught if the doctor protected them.' : ''));
  steps.push('Everyone talks it over, then votes one player out. Tap their name.');
  let h = win ? `<div class="center"><p class="tag good">${win}</p></div>` : '';
  h += `<section><h2>Each round</h2><p class="muted">Pick a narrator to read these out. A narrator who is not playing can hold the button further down to see every role.</p>` +
    `<ol class="steps">${steps.map(s => `<li>${s}</li>`).join('')}</ol></section>`;
  h += `<section><h2>Players</h2><p class="muted">${alive.length} still in. Tap a name when that player is out.</p>` +
    `<div class="list">${G.players.map((n, i) => `<button class="row${G.out.includes(i) ? ' out' : ''}" data-act="wolfOut" data-i="${i}" aria-pressed="${G.out.includes(i)}"><span>${esc(n)}</span>` +
      `<span class="st">${view.roles ? ROLE[G.roles[i]][0] + ' ' + ROLE[G.roles[i]][1] : G.out.includes(i) ? 'Out' : ''}</span></button>`).join('')}</div></section>`;
  h += `<section><h2>Daytime talk</h2>${clock()}</section>`;
  h += `<section><h2>Roles</h2>${view.roles ? `<button class="btn alt" data-act="hideRoles">Hide the roles</button>`
    : `<div class="center">${holdBtn('Hold to see roles', true)}<p class="muted">For the narrator, or once the game is over.</p></div>`}</section>`;
  h += `<section>${againBtns('wolf')}</section>`;
  return page('Werewolf', h, 'home', true);
};

/* Who am I */
V.who = () => {
  const name = G.players[G.turn], id = G.deck[G.k % G.deck.length];
  let b;
  if (view.ph === 'ready') b = `<div class="center"><p class="lead">Next up</p><p class="big">${esc(name)}</p>` +
    `<p class="lead">Tap start, then hold the phone on your forehead with the screen facing out. No peeking.</p>` +
    `<p class="muted">Ask yes or no questions to work out who you are. You get 20.</p></div><button class="btn" data-act="whoStart">Start</button>`;
  else if (view.ph === 'count') b = `<div class="center"><p class="lead">Phone on your forehead, ${esc(name)}</p><p class="huge">${view.c}</p></div>`;
  else if (view.ph === 'show') b = `<div class="center"><p class="huge">${esc(id)}</p><p class="lead">${view.q >= 20 ? 'That is 20 questions. One last guess.' : `Question ${view.q} of 20`}</p></div>` +
    `<button class="btn alt" data-act="whoQ" ${view.q >= 20 ? 'disabled' : ''}>Count a question</button>` +
    `<div class="pair"><button class="btn" data-act="whoEnd" data-ok="1">Guessed it</button><button class="btn alt" data-act="whoEnd" data-ok="0">Give up</button></div>`;
  else b = `<div class="center"><p class="tag ${view.ok ? 'good' : 'bad'}">${view.ok ? 'Guessed it' : 'Not this time'}</p><p class="lead">${esc(name)} was</p><p class="big">${esc(id)}</p>` +
    (view.ok ? `<p class="muted">One point, using ${view.q} question${view.q === 1 ? '' : 's'}.</p>` : '') + `</div>` +
    `<button class="btn" data-act="whoNext">Next: ${esc(G.players[(G.turn + 1) % G.players.length])}</button>` +
    `<button class="btn quiet" data-act="open" data-g="who">Change players or settings</button>` + board('who');
  return page('Who am I?', b, 'home', true);
};

/* Truth or dare */
V.tod = () => {
  const name = G.players[G.turn % G.players.length];
  const b = view.kind
    ? `<div class="center"><p class="tag">${esc(name)}, ${view.kind === 'truth' ? 'truth' : 'dare'}</p><p class="big sm">${esc(view.text)}</p></div>` +
      `<button class="btn" data-act="todNext">Next player</button><button class="btn quiet" data-act="todPick" data-kind="${view.kind}">Give me a different one</button>`
    : `<div class="center"><p class="lead">It is your turn</p><p class="big">${esc(name)}</p></div>` +
      `<div class="pair"><button class="btn" data-act="todPick" data-kind="truth">Truth</button><button class="btn alt" data-act="todPick" data-kind="dare">Dare</button></div>`;
  return page('Truth or dare', b, 'home', true);
};

/* Charades */
V.char = () => {
  const name = G.players[G.turn];
  let b;
  if (view.ph === 'ready') b = `<div class="center"><p class="lead">Next to act</p><p class="big">${esc(name)}</p>` +
    `<p class="lead">Act out each word with no talking and no pointing at things. You have one minute.</p></div><button class="btn" data-act="charStart">Start</button>`;
  else if (view.ph === 'go') b = `<div class="center"><p class="muted">Only ${esc(name)} looks at the screen</p><p class="huge">${esc(G.deck[G.k % G.deck.length][0])}</p>` +
    `<div id="clock" role="timer">${mmss(view.left)}</div></div>` +
    `<div class="pair"><button class="btn" data-act="charGot">Got it</button><button class="btn alt" data-act="charSkip">Skip</button></div><p class="muted">${view.got} so far</p>`;
  else b = `<div class="center"><p class="tag good">Time is up</p><p class="lead">${esc(name)} got</p><p class="huge">${view.got}</p></div>` +
    `<button class="btn" data-act="charNext">Next: ${esc(G.players[(G.turn + 1) % G.players.length])}</button>` +
    `<button class="btn quiet" data-act="open" data-g="char">Change players or settings</button>` + board('char');
  return page('Charades', b, 'home', true);
};

/* Quick quiz */
V.quiz = () => {
  const name = G.players[G.turn], q = G.deck[G.k % G.deck.length];
  const b = view.ph === 'ask'
    ? `<p class="tag">${esc(name)}, this one is yours</p><p class="big sm">${esc(q[0])}</p>` +
      `<div class="list">${view.opts.map((o, i) => `<button class="row" data-act="quizPick" data-i="${i}"><span>${esc(o)}</span></button>`).join('')}</div>`
    : `<div class="center"><p class="tag ${view.ok ? 'good' : 'bad'}">${view.ok ? 'Correct' : 'Not quite'}</p><p class="lead">${esc(q[0])}</p><p class="big sm">${esc(q[1])}</p></div>` +
      `<button class="btn" data-act="quizNext">Next: ${esc(G.players[(G.turn + 1) % G.players.length])}</button>` +
      `<button class="btn quiet" data-act="open" data-g="quiz">Change players or settings</button>` + board('quiz');
  return page('Quick quiz', b, 'home', true);
};

/* Most likely to */
V.mlt = () => {
  const q = G.deck[G.k % G.deck.length];
  const b = view.who == null
    ? `<div class="center"><p class="lead">Who is most likely to</p><p class="big sm">${esc(q)}?</p></div>` +
      `<p class="muted">Count to three and all point. Then tap whoever got the most fingers.</p>` +
      `<div class="list">${G.players.map((n, i) => `<button class="row" data-act="mltPick" data-i="${i}"><span>${esc(n)}</span></button>`).join('')}</div>` +
      `<button class="btn quiet" data-act="mltNext">Skip this one</button>`
    : `<div class="center"><p class="lead">Most likely to ${esc(q)}</p><p class="big">${esc(G.players[view.who])}</p></div>` +
      `<button class="btn" data-act="mltNext">Next one</button>` +
      `<button class="btn quiet" data-act="open" data-g="mlt">Change players or settings</button>` + board('mlt');
  return page('Most likely to', b, 'home', true);
};

/* Would you rather */
V.wyr = () => {
  const q = G.deck[G.k % G.deck.length];
  let b;
  if (view.votes.length < G.players.length) {
    const name = G.players[view.votes.length];
    b = `<div class="center"><p class="tag">${esc(name)}, your choice</p><p class="lead">Would you rather</p></div>` +
      `<button class="btn" data-act="wyrVote" data-v="0">${esc(q[0])}</button><p class="lead" style="text-align:center">or</p>` +
      `<button class="btn alt" data-act="wyrVote" data-v="1">${esc(q[1])}</button>` +
      `<p class="muted">Choose without showing anyone, then pass the phone on. Vote ${view.votes.length + 1} of ${G.players.length}.</p>`;
  } else {
    const side = v => G.players.filter((_, i) => view.votes[i] === v);
    b = [0, 1].map(v => `<section><h2>${side(v).length} would rather ${esc(q[v])}</h2><p class="lead">${side(v).length ? side(v).map(esc).join(', ') : 'Nobody'}</p></section>`).join('') +
      `<section><button class="btn" data-act="wyrNext">Next question</button><button class="btn quiet" data-act="open" data-g="wyr">Change players or settings</button></section>`;
  }
  return page('Would you rather', b, 'home', true);
};

/* Guess the number */
// Guessing goes round the circle, starting with the player after the chooser.
const numGuessers = () => G.players.slice(G.chooser + 1).concat(G.players.slice(0, G.chooser));
V.num = () => {
  const chooser = G.players[G.chooser], guessers = numGuessers(), who = guessers[G.g % guessers.length];
  const grid = (act, off) => `<div class="nums">${Array.from({length: G.max}, (_, i) => i + 1).map(n =>
    `<button data-act="${act}" data-n="${n}" class="${view.pick === n ? 'on' : ''}" ${off && G.tried.includes(n) ? 'disabled' : ''}>${n}</button>`).join('')}</div>`;
  let b;
  if (view.ph === 'hand') b = `<div class="center"><p class="lead">Hand the phone to</p><p class="big">${esc(chooser)}</p>` +
    `<p class="lead">${esc(chooser)} chooses a secret number from 1 to ${G.max}. Everyone else looks away.</p></div><button class="btn" data-act="numBegin">Choose a number</button>`;
  else if (view.ph === 'choose') b = `<p class="tag">${esc(chooser)}, choose your number</p>` + grid('numSet') +
    `<button class="btn" id="lockBtn" data-act="numLock" ${view.pick == null ? 'disabled' : ''}>Lock it in and hide it</button>`;

/* Find the agent */
const agGuessers = () => G.players.slice(G.chooser + 1).concat(G.players.slice(0, G.chooser));
// A resident's eyes drift towards the agent's window. dx and dy are -1 to 1.
const faceSVG = (dx, dy, asleep) => `<svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 34c0-8 5-11 12-11s12 3 12 11z" fill="#4E7FA8"/><circle cx="15" cy="14" r="9.5" fill="#E7B98C"/>` +

      `<circle cx="${(11.2 + dx * 1.5).toFixed(2)}" cy="${(13.5 + dy * 1.5).toFixed(2)}" r="1.4" fill="#22180F"/><circle cx="${(18.8 + dx * 1.5).toFixed(2)}" cy="${(13.5 + dy * 1.5).toFixed(2)}" r="1.4" fill="#22180F"/>`) + `</svg>`;
const SIL = `<svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 34c0-8 5-11 12-11s12 3 12 11z" fill="#141C26"/><circle cx="15" cy="14" r="8" fill="#141C26"/><path d="M6 10h18l-3-3H9z" fill="#141C26"/></svg>`;
// Red herrings: each looks like someone hiding, and turns out to be something ordinary.
const H = (body) => `<svg class="h" viewBox="0 0 50 60" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;
const HER = {
  shoes: {set: {bg: 'lit', curt: true}, vis: H('<ellipse cx="4.5" cy="57" rx="3.4" ry="2.2" fill="#15110E"/><ellipse cx="10.5" cy="57" rx="3.4" ry="2.2" fill="#15110E"/>'),

  eyes: {set: {bg: '', curt: false}, vis: H('<g class="bl" fill="#C4F36B"><circle cx="20.5" cy="27" r="1.7"/><circle cx="29.5" cy="27" r="1.7"/></g>'),
    inside: ['🦉', 'A toy owl with glow-in-the-dark eyes.']},
  scope: {set: {bg: 'cool', curt: false}, vis: H('<path d="M17 47L37 37" stroke="#1B222C" stroke-width="4.5" stroke-linecap="round"/><path d="M26 44l-5 14M26 44l6 14" stroke="#1B222C" stroke-width="1.6"/>'),
    inside: ['🔭', 'A telescope pointed at the moon. Nobody is using it.']},
  sway: {set: {bg: 'lit', curt: false}, vis: H('<g class="sw"><ellipse cx="25" cy="24" rx="8" ry="10" fill="#141C26"/><path d="M19 33h12v27H19z" fill="#141C26" opacity="0"/></g>'),
    inside: ['🎈', 'A balloon left over from a party, bobbing about.']},
  paper: {set: {bg: 'lit', curt: false}, vis: H('<rect x="11" y="17" width="28" height="27" fill="#ECE8DC"/><path d="M14 36h22M14 39h22M14 42h14" stroke="#9A958A" stroke-width="1"/><circle cx="20" cy="26" r="1.9" fill="#141C26"/><circle cx="30" cy="26" r="1.9" fill="#141C26"/>'),
    inside: ['📰', 'Grandad behind his newspaper. The holes are from moths.']},
  glove: {set: {bg: 'dim', curt: true}, vis: H('<path d="M33 27h5v8h-5a3 3 0 0 1 0-8z" fill="#E7B98C"/><path d="M33 29h4M33 31h4M33 33h4" stroke="#B98A61" stroke-width=".7"/>'),
    inside: ['🧤', 'A rubber glove pegged to the curtain to dry.']}
};
function agInside(c){
  if (c.her) return [`<span aria-hidden="true">${HER[c.her].inside[0]}</span>`, HER[c.her].inside[1]];
  if (c.sil) return ['<span aria-hidden="true">🧥</span>', 'Only a coat and hat on a stand.'];
  if (c.deco === 'cat') return ['<span aria-hidden="true">🐈</span>', 'Only the cat.'];
  if (c.res === 'asleep') return [faceSVG(0, 0, true), 'Someone fast asleep. Not the agent.'];
  if (c.res) return [faceSVG(c.dx, c.dy), 'Someone is home, but it is not the agent.'];
  if (c.deco === 'plant') return ['<span aria-hidden="true">🪴</span>', 'Just a pot plant.'];
  return ['', 'An empty room.'];
}
function agBuild(pos){
  const hard = G.cols === 5, n = G.cols * G.rows, bgs = ['', '', 'lit', 'lit', 'cool', 'dim'];
  const ar = Math.floor(pos / G.cols), ac = pos % G.cols;
  const cells = Array.from({length: n}, (_, i) => {
    const r = Math.floor(i / G.cols), c = i % G.cols, len = Math.hypot(ac - c, ar - r) || 1;
    const deco = [null, null, null, 'plant', 'cat'][rnd(5)];
    return {bg: bgs[rnd(bgs.length)], curt: Math.random() < .5, deco, res: deco === 'cat' ? null : Math.random() < .55 ? (hard && Math.random() < .3 ? 'asleep' : 'awake') : null,
      dx: (ac - c) / len, dy: (ar - r) / len, d: (-Math.random() * 8).toFixed(1), open: false};
  });
  Object.assign(cells[pos], {curt: true, tw: true, gl: true, deco: null, res: null, bg: bgs[rnd(bgs.length)]});
  const rest = shuffle(cells.map((_, i) => i).filter(i => i !== pos));
  let k = 0;
  const take = (count, props) => { for (let j = 0; j < count; j++) Object.assign(cells[rest[k++]], props); };
  take(hard ? 3 : 2, {sil: true, bg: 'lit', curt: false, deco: null, res: null});   // a figure that turns out to be a coat stand
  take(hard ? 2 : 1, {flick: true, bg: 'lit'});
  shuffle(Object.keys(HER)).slice(0, hard ? 5 : 3).forEach(h => take(1, Object.assign({her: h, deco: null, res: null}, HER[h].set)));                                        // a light on the blink
  if (hard) { take(2, {tw: true, curt: true}); take(1, {gl: true}); }                 // half of the real giveaway, never both
  return cells;
}
function agBuilding(play){
  const cell = (c, i) => {
    const lab = `Window ${i % G.cols + 1}, floor ${G.rows - Math.floor(i / G.cols)}`;
    if (!play) return `<button class="win${view.pick === i ? ' on' : ''}" data-act="agSet" data-i="${i}" aria-label="${lab}"></button>`;
    if (c.open) return `<button class="win open" disabled aria-label="${lab}, already checked">${agInside(c)[0].replace('<span', '<em').replace('</span>', '</em>')}</button>`;
    return `<button class="win ${c.bg}${c.flick ? ' flick' : ''}${c.tw ? ' tw' : ''}" style="--d:${c.d}s" data-act="agGuess" data-i="${i}" aria-label="${lab}">` +
      (c.curt ? '<i class="cl"></i><i class="cr"></i>' : '') + (c.sil ? SIL : '') + (c.her ? HER[c.her].vis : '') + (c.deco ? `<em aria-hidden="true">${c.deco === 'cat' ? '🐈' : '🪴'}</em>` : '') + (c.gl ? '<b class="gl"></b>' : '') + `</button>`;
  };
  const cells = play ? G.cells : Array.from({length: G.cols * G.rows});
  return `<div class="bld"><div class="wins" style="--c:${G.cols}">${cells.map(cell).join('')}</div><div class="door"></div></div>`;
}
V.agent = () => {

/* ----- Two-player classics ----- */
// With more than two players the winner stays on and the next player steps in.
const duelPeek = loser => G.bench.length ? [G.pair[1 - Math.max(loser, 0)], G.bench[0]] : [G.pair[1], G.pair[0]];
function duelNext(loser){
  if (G.bench.length) { const l = Math.max(loser, 0); G.bench.push(G.pair[l]); G.pair = [G.pair[1 - l], G.bench.shift()]; }
  else G.pair.reverse();
}
const duelBtns = (loser, key) => { const nx = duelPeek(loser);
  return `<button class="btn" data-act="duelAgain">Next game: ${esc(nx[0])} v ${esc(nx[1])}</button>` +
    `<button class="btn quiet" data-act="open" data-g="${G.type}">Change players or settings</button>` + board(key); };

/* Noughts and crosses, and Four in a row */
function gridNew(){
  const hard = S.level === 'hard';
  Object.assign(G, G.type === 'four' ? {w: hard ? 9 : 7, h: hard ? 7 : 6, k: hard ? 5 : 4} : {w: hard ? 5 : 3, h: hard ? 5 : 3, k: hard ? 4 : 3});
  G.cells = Array(G.w * G.h).fill(null); G.turn = 0; G.done = false; G.hit = []; G.winner = -1;
}
function gridWin(i){
  const x = i % G.w, y = Math.floor(i / G.w), p = G.cells[i];
  for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
    const line = [i];
    for (const sg of [1, -1]) { let cx = x + dx * sg, cy = y + dy * sg;
      while (cx >= 0 && cx < G.w && cy >= 0 && cy < G.h && G.cells[cy * G.w + cx] === p) { line.push(cy * G.w + cx); cx += dx * sg; cy += dy * sg; } }
    if (line.length >= G.k) return line;
  }
  return null;
}
V.grid = () => {
  const four = G.type === 'four', mark = four ? ['red', 'yellow'] : ['✕', '○'], name = G.pair[G.turn];
  const head = G.done ? `<p class="tag ${G.winner >= 0 ? 'good' : ''}">${G.winner >= 0 ? esc(G.pair[G.winner]) + ' wins' : 'A draw'}</p>`
    : `<p class="tag">${esc(name)}, your turn (${mark[G.turn]})</p>`;
  const b = head + `<div class="grid ${four ? 'four' : 'oxo'}" style="--c:${G.w}">${G.cells.map((v, i) =>
      `<button class="gc${v === null ? '' : ' p' + v}${G.hit.includes(i) ? ' hit' : ''}" data-act="gridTap" data-i="${i}" aria-label="Column ${i % G.w + 1}, row ${Math.floor(i / G.w) + 1}${v === null ? '' : ', ' + esc(G.pair[v])}">${four || v === null ? '' : mark[v]}</button>`).join('')}</div>` +
    `<p class="muted">${esc(G.pair[0])} is ${mark[0]}, ${esc(G.pair[1])} is ${mark[1]}. ${G.k} in a row wins.${four ? ' Tap a column to drop a counter.' : ''}</p>` +
    (G.done ? duelBtns(G.winner < 0 ? -1 : 1 - G.winner, G.type) : '');
  return page(GAMES[G.type].t, b, 'home', true);
};

/* Hangman, drawn as a snowman that gets built with each wrong guess */
const isLetter = ch => /\p{L}/u.test(ch);

const hangGuessers = () => G.auto ? G.players : G.players.slice(G.setter + 1).concat(G.players.slice(0, G.setter));

  const parts = ['<circle cx="50" cy="96" r="21"/>', '<circle cx="50" cy="63" r="15"/>', '<circle cx="50" cy="40" r="11"/>', '<path d="M36 60L18 47"/>', '<path d="M64 60L82 47"/>',
    '<circle class="dk" cx="46" cy="38" r="1"/><circle class="dk" cx="54" cy="38" r="1"/>', '<path class="nose" d="M50 41l11 3-11 2z"/>', '<path class="dk" d="M39 30h22M42 30V18h16v12z"/>'];
  return `<svg class="snow" viewBox="0 0 100 120" role="img" aria-label="Snowman, ${stage} of 8 parts built">${parts.slice(0, stage).join('')}</svg>`;
}

  else if (view.ph === 'type') b = `<p class="tag">${esc(setter)}, type your word</p>` +
    `<input id="hw" type="text" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" data-enter="hangSet" aria-label="Secret word or short phrase">` +
    `<p class="muted">A word or short phrase, up to 24 letters.</p><button class="btn" data-act="hangSet">Hide it and start</button>`;

  }

  else if (view.ph === 'run') b = `<div class="center"><p class="tag">${esc(name)}, aim for ${T}.00</p><div id="clock" role="timer">0.00</div></div><button class="btn" style="min-height:120px" data-down="stopHit">Stop</button>`;
  else if (view.ph === 'shown') { const t = G.times[G.i], d = t - T;
    b = `<div class="center"><p class="lead">${esc(name)} stopped at</p><p class="huge">${t.toFixed(2)}</p><p class="tag">${Math.abs(d) < .005 ? 'Dead on' : Math.abs(d).toFixed(2) + (d > 0 ? ' over' : ' under')}</p></div>` +
      `<button class="btn" data-act="stopNext">${G.i + 1 < G.players.length ? 'Next: ' + esc(G.players[G.i + 1]) : 'See who was closest'}</button>`; }
  else { const rank = G.players.map((p, i) => ({p, t: G.times[i], d: Math.abs(G.times[i] - T)})).sort((a, c) => a.d - c.d);
    b = `<div class="center"><p class="tag good">${esc(rank[0].p)} was closest</p></div><table class="board">${rank.map(r => `<tr><td>${esc(r.p)}</td><td>${r.t.toFixed(2)}</td></tr>`).join('')}</table>` +
      `<p class="muted">The target was ${T}.00 seconds.</p>` + againBtns('stopc') + board('stopc'); }
  return page('Stop the clock', b, 'home', true);
};

/* Quick draw */
V.quick = () => {
  const st = G.state, sig = {idle: 'Fingers ready', wait: 'Wait for it', fake: 'Not yet', go: 'Go!'}[st];
  const head = st === 'done' ? `<p class="tag ${G.win >= 0 ? 'good' : 'bad'}">${G.win >= 0 ? `${esc(G.players[G.win])} was fastest, in ${G.ms} ms` : 'Everyone jumped the gun'}</p>` : `<div class="sig ${st}" aria-live="assertive">${sig}</div>`;
  const b = head + `<div class="pads big" style="--c:2">${G.players.map((p, i) => `<button class="pad2" style="--pc:${COL[i]}" data-down="quickTap" data-i="${i}" ${G.out.includes(i) ? 'disabled' : ''}>${esc(p)}${G.out.includes(i) ? ' (too soon)' : ''}</button>`).join('')}</div>` +
    (st === 'idle' ? `<button class="btn" data-act="quickStart">Start</button><p class="muted">Each player rests a finger near their own name. Tap when the screen says go. Tap early and you are out.</p>` : '') +
    (st === 'done' ? againBtns('quick') + board('quick') : '');
  return page('Quick draw', b, 'home', true);
};

/* ---------- game starters ---------- */
function startGame(type, players){
  if (type === 'imp') {
    const list = wordList();
    let fresh = list.filter(e => !used.has(e[0]));
    if (!fresh.length) { list.forEach(e => used.delete(e[0])); fresh = list; }
    const e = fresh[rnd(fresh.length)]; used.add(e[0]);
    const imp = rnd(players.length);
    G = {type, players, word: e[0], imp, starter: players[rnd(players.length)], scored: false,
      L: {t:'Imposter', who:'imposter', secret:'The word', key:'imp', talk:'Go around the circle. Each player says one thing about the word without giving it away.'},
      cards: players.map((name, i) => ({name, html: i === imp
        ? `<p class="tag bad">You are the imposter</p><p class="lead">You do not get the word. Your clue is</p><p class="big sm">${esc(e[2])}</p><p class="muted">Blend in, and try to work out the word.</p>`
        : `<p class="tag">The secret word</p><p class="big">${esc(e[0])}</p><p class="lead">${esc(e[1])}</p><p class="muted">One of the others is an imposter with a different clue.</p>`})),
      after: () => go('impTalk', {left: S.timer, total: S.timer, run: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'grinch') {
    const n = S.level === 'easy' ? 12 : 15, th = THEMES[S.theme] || THEMES.xmas, all = shuffle(th.items);
    G = {type, players, th, key: S.theme, shelf: all.slice(0, n), spare: all.slice(n), grinch: rnd(players.length), stolen: null,
      cards: players.map((name, i) => ({name, html: () => {
        const isG = i === G.grinch;
        return `<p class="tag ${isG ? 'bad' : 'good'}">You are ${isG ? th.thief : th.one}</p>` +
          `<p class="lead">${isG ? `Tap the ${th.thing} you want to steal.` : `Tap any ${th.thing} to ${th.nudge}. Everyone taps one, so ${th.thief} stays hidden.`}</p>` + shelfHTML(G.shelf, 'pickGift');
      }})),
      after: () => {
        G.rem = shuffle(G.shelf.filter((_, k) => k !== G.stolen));
        G.opts = shuffle([G.shelf[G.stolen]].concat(G.spare.slice(0, S.level === 'easy' ? 5 : 8)));
        go('grGuess', {pick: null});
      }};
    return go('grMem', {left: n === 12 ? 20 : 25});
  }
  if (type === 'wolf') {
    const n = players.length, w = n >= 11 ? 3 : n >= 7 ? 2 : 1;
    let roles = Array(w).fill('wolf');
    if (S.level === 'hard') { roles.push('seer'); if (n >= 5) roles.push('doctor'); }
    while (roles.length < n) roles.push('villager');
    roles = shuffle(roles);
    G = {type, players, roles, out: [],
      cards: players.map((name, i) => { const r = ROLE[roles[i]];
        const pack = players.filter((_, j) => j !== i && roles[j] === 'wolf');
        return {name, html: `<p class="huge" aria-hidden="true">${r[0]}</p><p class="big">${r[1]}</p><p class="lead">${r[2]}</p>` +
          (roles[i] === 'wolf' && pack.length ? `<p class="tag bad">Your pack: ${pack.map(esc).join(', ')}</p>` : '')}; }),
      after: () => go('wolf', {left: S.timer, total: S.timer, run: false, roles: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'spy') {
    const list = SPOTS[S.level];
    let fresh = list.filter(x => !used.has(x));
    if (!fresh.length) { list.forEach(x => used.delete(x)); fresh = list; }
    const place = fresh[rnd(fresh.length)]; used.add(place);
    const spy = rnd(players.length);
    G = {type, players, word: place, imp: spy, starter: players[rnd(players.length)], scored: false,
      L: {t:'Spot the spy', who:'spy', secret:'The place', key:'spy', list,
        talk:'Take turns asking each other questions about where you are. Answer without giving the place away.'},
      cards: players.map((name, i) => ({name, html: i === spy
        ? `<p class="tag bad">You are the spy</p><p class="lead">Everyone else knows where you all are. You do not.</p><p class="muted">Listen to the answers, work out the place, and do not get caught.</p>`
        : `<p class="tag">You are all at</p><p class="big">${esc(place)}</p><p class="muted">One player is a spy who does not know this. Answer questions without making it obvious.</p>`})),
      after: () => go('impTalk', {left: S.timer, total: S.timer, run: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'char') { G = {type, players, turn: 0, k: 0, deck: shuffle(wordList())}; return go('char', {ph: 'ready'}); }
  if (type === 'quiz') { G = {type, players, turn: 0, k: 0, deck: shuffle(QUIZ[S.level])}; return go('quiz', {ph: 'ask', opts: shuffle(G.deck[0].slice(1))}); }
  if (type === 'mlt') { G = {type, players, k: 0, deck: shuffle(MLT[S.level])}; return go('mlt', {who: null}); }
  if (type === 'wyr') { G = {type, players, k: 0, deck: shuffle(WYR[S.level])}; return go('wyr', {votes: []}); }
  if (type === 'num') { G = {type, players, chooser: 0, g: 0, tried: [], secret: null, max: S.level === 'easy' ? 20 : 50}; return go('num', {ph: 'hand', pick: null}); }
  if (type === 'agent') { const hard = S.level === 'hard'; G = {type, players, chooser: 0, g: 0, tries: 0, cols: hard ? 5 : 4, rows: hard ? 6 : 5, cells: null, pos: null}; return go('agent', {ph: 'hand', pick: null}); }
  if (type === 'oxo' || type === 'four') { G = {type, pair: [players[0], players[1]], bench: players.slice(2)}; gridNew(); return go('grid', {}); }
  if (type === 'rps') { G = {type, pair: [players[0], players[1]], bench: players.slice(2), target: S.level === 'easy' ? 3 : 5, sc: [0, 0], picks: []}; return go('rps', {ph: 'pick'}); }
  if (type === 'pairs') {
    const n = S.level === 'easy' ? 6 : 10, pick = shuffle(GIFTS).slice(0, n);
    G = {type, players, turn: 0, open: [], lock: false, got: {}, done: false, winners: [], cards: shuffle(pick.concat(pick)).map(e => ({e, up: false, gone: false}))};
    return go('pairs', {});
  }
  if (type === 'hang') { G = {type, players, setter: 0, word: '', tried: [], wrong: 0, g: 0, max: S.level === 'easy' ? 8 : 6, auto: false, done: false}; return go('hang', {ph: 'hand'}); }
  if (type === 'fire') { G = {type, players}; fireNew(); return go('fire', {}); }
  if (type === 'pump') { const easy = S.level === 'easy'; G = {type, players, turn: 0, size: 0, pop: easy ? 6 + rnd(10) : 10 + rnd(21), done: false}; return go('pump', {}); }
  if (type === 'stopc') { const easy = S.level === 'easy'; G = {type, players, i: 0, times: [], target: easy ? 5 : 10, hide: easy ? 3 : 2}; return go('stopc', {ph: 'ready'}); }
  if (type === 'quick') { G = {type, players, out: [], state: 'idle', win: -1, ms: 0, round: (G && G.round || 0) + 1}; return go('quick', {}); }
  if (type === 'who') {
    G = {type, players, turn: 0, k: 0, deck: shuffle(WHO[S.level])};
    return go('who', {ph: 'ready', q: 0});
  }
  if (type === 'tod') {
    G = {type, players: shuffle(players), turn: 0, deck: {truth: shuffle(TOD[S.level].truth), dare: shuffle(TOD[S.level].dare)}, at: {truth: 0, dare: 0}};
    return go('tod', {});
  }
}

/* ---------- actions ---------- */
const A = {};

// PIN
A.admin = () => unlocked ? go('admin') : go('pin', {mode: S.santa.pin ? 'enter' : 'set', buf: '', first: '', err: ''});
A.changePin = () => go('pin', {mode: 'set', buf: '', first: '', err: ''});
A.key = el => {
  const k = el.dataset.k;
  if (k === 'del') view.buf = view.buf.slice(0, -1); else if (view.buf.length < 4) view.buf += k;
  view.err = '';
  if (view.buf.length === 4) {
    if (view.mode === 'enter') {
      if (view.buf === S.santa.pin) { unlocked = true; return go('admin'); }
      view.err = 'That PIN is not right. Try again.'; view.buf = '';
    } else if (view.mode === 'set') { view.first = view.buf; view.buf = ''; view.mode = 'confirm'; }
    else {
      if (view.buf === view.first) { S.santa.pin = view.buf; save(); unlocked = true; toast('PIN saved'); return go('admin'); }
      view.err = 'Those two did not match. Choose a PIN again.'; view.buf = ''; view.mode = 'set';
    }
  }
  render();
};
A.erase = () => { S = blank(); save(); unlocked = false; G = null; toast('Everything erased'); go('home'); };

// admin

A.delDraw = () => { S.santa.draws.splice(view.i, 1); save(); toast('Draw deleted'); go('admin'); };
A.export = () => {
  const name = `pass-the-phone-backup-${new Date().toISOString().slice(0, 10)}.json`, data = JSON.stringify(S, null, 1);
  try {
    const file = new File([data], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: 'Pass the Phone backup'}).catch(() => {}); return; }
  } catch (e) {}
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); toast('Backup file saved');
  } catch (e) { toast('This browser could not save a file'); }
};

  go('agent', {ph: 'ans', ok, val: i, pick: null});
};
A.agOn = () => { G.g++; go('agent', {ph: 'guess', pick: null}); };
A.agRound = () => { G.chooser = (G.chooser + 1) % G.players.length; G.cells = null; G.pos = null; go('agent', {ph: 'hand', pick: null}); };

// two-player classics
A.duelAgain = () => {
  if (G.type === 'rps') { duelNext(G.sc[0] > G.sc[1] ? 1 : 0); G.sc = [0, 0]; G.picks = []; return go('rps', {ph: 'pick'}); }
  duelNext(G.winner < 0 ? -1 : 1 - G.winner); gridNew(); go('grid', {});
};
A.gridTap = el => {
  if (G.done) return;
  let i = +el.dataset.i;
  if (G.type === 'four') { const col = i % G.w; i = -1; for (let r = G.h - 1; r >= 0; r--) if (G.cells[r * G.w + col] === null) { i = r * G.w + col; break; } if (i < 0) return; }
  else if (G.cells[i] !== null) return;
  G.cells[i] = G.turn;
  const line = gridWin(i);
  if (line) { G.done = true; G.hit = line; G.winner = G.turn; const n = G.pair[G.turn]; pts(G.type)[n] = (pts(G.type)[n] || 0) + 1; save(); }
  else if (G.cells.every(v => v !== null)) G.done = true;
  else G.turn = 1 - G.turn;
  render();
};
A.pairTap = el => {
  const i = +el.dataset.i, c = G.cards[i];
  if (G.lock || G.done || c.up || c.gone) return;
  c.up = true; G.open.push(i);
  if (G.open.length === 2) {
    const [a, b] = G.open.map(k => G.cards[k]);
    if (a.e === b.e) {
      a.gone = b.gone = true; G.open = [];
      const n = G.players[G.turn % G.players.length]; G.got[n] = (G.got[n] || 0) + 1;
      if (G.cards.every(x => x.gone)) {
        G.done = true; const best = Math.max(...G.players.map(p => G.got[p] || 0));
        G.winners = G.players.filter(p => (G.got[p] || 0) === best);
        G.winners.forEach(p => { pts('pairs')[p] = (pts('pairs')[p] || 0) + 1; }); save();
      }
    } else {
      G.lock = true;
      tick = setTimeout(() => { tick = null; a.up = b.up = false; G.open = []; G.lock = false; G.turn++; if (view.n === 'pairs') render(); }, 1200);
    }
  }
  render();
};
A.rpsPick = el => {
  G.picks.push(+el.dataset.i);
  if (G.picks.length < 2) return render();
  const [a, b] = G.picks, w = a === b ? -1 : (a - b + 3) % 3 === 1 ? 0 : 1;
  if (w >= 0) { G.sc[w]++; if (G.sc[w] >= G.target) { const n = G.pair[w]; pts('rps')[n] = (pts('rps')[n] || 0) + 1; save(); } }
  view.ph = 'show'; view.w = w; render();
};
A.rpsOn = () => { G.picks = []; go('rps', {ph: 'pick'}); };
A.hangType = () => { view.ph = 'type'; view.focus = 'hw'; render(); };
const hangBegin = () => { G.tried = []; G.wrong = 0; G.g = 0; G.done = false; G.solved = false; go('hang', {ph: 'play'}); };
A.hangAuto = () => { const l = wordList(); G.word = l[rnd(l.length)][0]; G.auto = true; hangBegin(); };
A.hangSet = () => {
  const inp = document.getElementById('hw'), w = inp.value.replace(/\s+/g, ' ').trim().slice(0, 24);
  if ([...w].filter(isLetter).length < 2) { toast('Type a word with at least two letters'); return inp.focus(); }
  G.word = w; G.auto = false; hangBegin();
};
A.hangKey = el => {
  if (G.done) return;
  const L = el.dataset.k, need = [...G.word].filter(isLetter).map(flat);
  G.tried.push(L);
  if (!need.includes(L)) G.wrong++;
  if (need.every(x => G.tried.includes(x))) { G.done = true; G.solved = true; hangGuessers().forEach(n => { pts('hang')[n] = (pts('hang')[n] || 0) + 1; }); save(); }
  else if (G.wrong >= G.max) { G.done = true; if (!G.auto) { const n = G.players[G.setter]; pts('hang')[n] = (pts('hang')[n] || 0) + 1; save(); } }
  else G.g++;
  render();
};
A.hangNext = () => { G.setter = (G.setter + 1) % G.players.length; G.word = ''; go('hang', {ph: 'hand'}); };

// fireworks
A.fireGo = el => {
  const i = +el.dataset.i;
  if (G.st[i]) return;
  G.st[i] = 1; el.disabled = true;
  const rk = document.getElementById('rk' + i), h = G.h[i], dur = h / 38, round = G.round;
  rk.style.transition = `bottom ${dur}s linear`;
  requestAnimationFrame(() => requestAnimationFrame(() => { rk.style.bottom = `calc(${h}% - .85rem)`; }));
  setTimeout(() => {
    if (view.n !== 'fire' || !G || G.type !== 'fire' || G.round !== round) return;
    G.st[i] = 2; buzz1();
    const ln = document.getElementById('ln' + i); if (ln) ln.innerHTML = fireBurst(i);
    if (G.st.every(x => x === 2)) setTimeout(() => {
      if (view.n !== 'fire' || !G || G.type !== 'fire' || G.round !== round) return;
      G.win = G.h.indexOf(Math.max(...G.h)); G.done = true;
      const n = G.players[G.win]; pts('fire')[n] = (pts('fire')[n] || 0) + 1; save(); render();
    }, 1100);
  }, dur * 1000 + 60);
};
const buzz1 = () => { try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} };

// balloon pump
A.pumpGo = el => {
  if (G.done) return;
  const k = +el.dataset.k, name = G.players[G.turn % G.players.length];
  if (G.size + k >= G.pop) {
    G.size = G.pop; G.done = true; G.loser = name; buzz();
    G.players.forEach(p => { if (p !== name) pts('pump')[p] = (pts('pump')[p] || 0) + 1; }); save();
  } else { G.size += k; G.turn++; }
  render();
};

// stop the clock
A.stopGo = () => {
  view.ph = 'run'; render(); G.t0 = performance.now();
  tick = setInterval(() => { const e = (performance.now() - G.t0) / 1000, c = document.getElementById('clock'); if (c) c.textContent = e < G.hide ? e.toFixed(2) : '?.??'; }, 40);
};
A.stopHit = () => { if (view.ph !== 'run') return; G.times[G.i] = (performance.now() - G.t0) / 1000; clearInterval(tick); tick = null; view.ph = 'shown'; render(); };
A.stopNext = () => {
  if (G.i + 1 < G.players.length) { G.i++; return go('stopc', {ph: 'ready'}); }
  let best = 0; G.times.forEach((t, i) => { if (Math.abs(t - G.target) < Math.abs(G.times[best] - G.target)) best = i; });
  const n = G.players[best]; pts('stopc')[n] = (pts('stopc')[n] || 0) + 1; save(); go('stopc', {ph: 'end'});
};

// quick draw
A.quickStart = () => {
  const round = G.round, alive = () => view.n === 'quick' && G && G.type === 'quick' && G.round === round && G.state !== 'done';
  let fakes = S.level === 'hard' ? 1 + rnd(2) : 0;
  const step = () => {
    tick = setTimeout(() => {
      if (!alive()) return;
      if (fakes > 0) { fakes--; G.state = 'fake'; render(); tick = setTimeout(() => { if (!alive()) return; G.state = 'wait'; render(); step(); }, 550); }
      else { G.state = 'go'; G.t0 = performance.now(); buzz1(); render(); }
    }, 1600 + rnd(3200));
  };
  G.state = 'wait'; render(); step();
};
A.quickTap = el => {
  const i = +el.dataset.i, st = G.state;
  if (st === 'idle' || st === 'done' || G.out.includes(i)) return;
  if (st === 'go') { G.ms = Math.round(performance.now() - G.t0); G.win = i; G.state = 'done'; const n = G.players[i]; pts('quick')[n] = (pts('quick')[n] || 0) + 1; save(); }
  else { G.out.push(i); if (G.out.length === G.players.length) { clearTimeout(tick); tick = null; G.win = -1; G.state = 'done'; } }
  render();
};

// truth or dare
A.todPick = el => { const k = el.dataset.kind, d = G.deck[k]; view.kind = k; view.text = d[G.at[k] % d.length]; G.at[k]++; render(); };
A.todNext = () => { G.turn++; go('tod', {}); };

/* change handlers */
const C = {};
C.limit = el => { S.santa.limit = el.value.replace(/[^0-9.]/g, ''); el.value = S.santa.limit; save(); };
C.cat = el => { S.cat = el.value; save(); };
C.timer = el => { S.timer = +el.value; save(); };
C.import = el => {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || o.v !== 1 || !o.santa || !Array.isArray(o.santa.people) || !Array.isArray(o.santa.draws)) throw new Error('bad');
      S = Object.assign(blank(), o); if (!S.tally || S.tally.elves !== undefined) S.tally = {}; if (!THEMES[S.theme]) S.theme = 'xmas'; save(); toast('Backup restored'); render();
    } catch (e) { toast('That file is not a Pass the Phone backup'); }
  };
  r.readAsText(f);
};

/* ---------- wiring ---------- */
function holdDone(){
  if (view.n === 'pass') { view.shown = true; if (G.onShown) G.onShown(); render(); window.scrollTo(0, 0); }
  else if (view.n === 'wolf') { view.roles = true; render(); }
}
function after(){
  const h = document.getElementById('hold');
  if (h) {
    let t = null;
    const stop = () => { clearTimeout(t); t = null; h.classList.remove('on'); };
    const start = e => { e.preventDefault(); if (t) return; h.classList.add('on'); t = setTimeout(() => { t = null; holdDone(); }, 900); };
    h.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(x => h.addEventListener(x, stop));
    h.addEventListener('contextmenu', e => e.preventDefault());
    h.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') start(e); });
    h.addEventListener('keyup', stop);
  }
  if (view.n === 'grMem' && !tick) tick = setInterval(() => {
    view.left--;
    if (view.left <= 0) { buzz(); return A.grReady(); }
    const c = document.getElementById('clock'); if (c) c.textContent = mmss(view.left);
  }, 1000);
  if (view.focus) { const f = document.getElementById(view.focus); view.focus = null; if (f) f.focus(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm !== undefined && armed !== el) { armed = el; el.textContent = el.dataset.confirm || 'Tap again to confirm'; return; }
  armed = null;
  const f = A[el.dataset.act]; if (f) f(el);
});
// Games where speed matters react on touch down, not on release.
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-down]'); if (el && !el.disabled && A[el.dataset.down]) { e.preventDefault(); A[el.dataset.down](el); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
document.addEventListener('keydown', e => { const t = e.target; if (e.key === 'Enter' && t && t.dataset && t.dataset.enter) { e.preventDefault(); A[t.dataset.enter](t); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (view.n === 'home') render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }

render();
})();
</script>
