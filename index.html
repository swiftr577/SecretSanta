<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pass the Phone</title>
<meta name="description" content="Secret Santa and party games for one phone passed around the room.">
<meta name="theme-color" content="#F2F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1F1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pass the Phone">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --tint:#E3EDE9; --ink:#12332B; --muted:#55706A;
  --line:#CFDCD6; --accent:#C4202A; --on-accent:#FFFFFF; --green:#17694C; --gold:#D99A1C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1F1A; --surface:#162E27; --tint:#1E3B33; --ink:#EAF3EF; --muted:#9FB7AF;
    --line:#2D4A41; --accent:#F2676C; --on-accent:#23070A; --green:#5AD0A4; --gold:#F0BC4A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:19px; line-height:1.45; -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
}
#app{max-width:540px; margin:0 auto; padding:0 18px calc(28px + env(safe-area-inset-bottom));}
h1,h2,p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 0 14px;}
.top h1{font-size:1.45rem; font-weight:800; letter-spacing:-.01em; flex:1}
.back{min-width:52px; height:52px; padding:0 14px; border-radius:26px; border:2px solid var(--line); background:var(--surface); font-size:1.05rem; font-weight:700}
.back.arrow{font-size:1.7rem; line-height:1; padding:0 0 4px}
.hero{padding:calc(34px + env(safe-area-inset-top)) 0 22px}
.hero h1{font-size:2.5rem; line-height:1.05; font-weight:800; letter-spacing:-.02em}
.hero p{color:var(--muted); margin-top:10px; max-width:22em}

main{display:flex; flex-direction:column; gap:16px}
section{display:flex; flex-direction:column; gap:12px; padding-top:18px; border-top:2px solid var(--line)}
section:first-child{border-top:0; padding-top:0}
h2{font-size:1.15rem; font-weight:800}
.lead{font-size:1.15rem}
.muted{color:var(--muted); font-size:.95rem}
.err{color:var(--accent); font-weight:700}
strong{font-weight:800}

/* buttons */
.btn{
  display:flex; align-items:center; justify-content:center; text-align:center; width:100%; min-height:60px; padding:12px 20px;
  border-radius:16px; border:2px solid var(--accent); background:var(--accent); color:var(--on-accent);
  font-size:1.15rem; font-weight:800;
}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--surface); color:var(--ink); border-color:var(--ink)}
.btn.quiet{background:transparent; color:var(--ink); border-color:transparent; text-decoration:underline; text-underline-offset:4px; min-height:52px; font-weight:700}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* home menu */
.menu{display:flex; flex-direction:column; gap:12px}
.menu h2{margin-top:14px}
.game{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; width:100%; text-align:left;
  padding:16px 18px; min-height:84px; border-radius:20px; border:2px solid var(--line); background:var(--surface);
}
.game b{display:block; font-size:1.3rem; font-weight:800}
.game span{display:block; color:var(--muted); font-size:.95rem}
.game i{font-style:normal; font-size:2.1rem}
.game.main{background:var(--accent); border-color:var(--accent); color:var(--on-accent); min-height:104px}
.game.main span{color:inherit; opacity:.9}
.game:active{transform:translateY(1px)}

/* lists */
.list{display:flex; flex-direction:column; border:2px solid var(--line); border-radius:18px; overflow:hidden; background:var(--surface)}
.row{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:62px; padding:10px 16px;
  background:transparent; border:0; border-top:2px solid var(--line); text-align:left; font-size:1.15rem; font-weight:700;
}
.row:first-child{border-top:0}
.row .st{font-size:.95rem; font-weight:600; color:var(--muted); text-align:right}
.row .st strong{color:var(--ink); font-size:1.1rem}
.row:disabled{opacity:1; cursor:default}
.row:disabled > span:first-child{color:var(--muted)}
.row:disabled .st{color:var(--green)}
.row.out > span:first-child{text-decoration:line-through; color:var(--muted)}
.acts{display:flex; gap:8px}
.mini{min-height:46px; min-width:46px; padding:0 14px; border-radius:23px; border:2px solid var(--line); background:transparent; font-size:.95rem; font-weight:700; color:var(--muted)}
.mini.on{background:var(--green); border-color:var(--green); color:var(--bg)}
.mini.x{padding:0}

/* inputs */
input[type=text],input:not([type]),select{
  width:100%; min-height:58px; padding:10px 16px; border-radius:16px; border:2px solid var(--line); background:var(--surface); font-size:1.1rem;
}
.add{display:grid; grid-template-columns:1fr auto; gap:10px}
.add .btn{width:auto; min-height:58px}
.money{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px; font-size:1.3rem; font-weight:800}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{min-height:52px; padding:8px 18px; border-radius:26px; border:2px solid var(--line); background:var(--surface); font-size:1.05rem; font-weight:700; color:var(--muted)}
.chip.on{background:var(--green); border-color:var(--green); color:var(--bg)}
.chip.on::before{content:"✓ "}
.seg{display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--ink); border-radius:16px; overflow:hidden}
.seg button{min-height:56px; border:0; background:var(--surface); font-size:1.1rem; font-weight:800}
.seg button.on{background:var(--ink); color:var(--bg)}
label.field{display:flex; flex-direction:column; gap:6px; font-weight:700}

/* handoff and reveal */
.handoff,.reveal,.center{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:18px 0 6px}
.big{font-size:2.6rem; line-height:1.1; font-weight:800; letter-spacing:-.02em; overflow-wrap:anywhere}
.big.sm{font-size:1.75rem}
.huge{font-size:3.4rem; line-height:1.05; font-weight:800; overflow-wrap:anywhere}
.tag{display:inline-block; padding:6px 16px; border-radius:20px; background:var(--tint); font-weight:800}
main>.tag{align-self:flex-start}
.tag.bad{background:var(--accent); color:var(--on-accent)}
.tag.good{background:var(--green); color:var(--bg)}
.hold{
  position:relative; width:210px; height:210px; border-radius:50%; border:0; margin:10px 0; background:var(--accent); color:var(--on-accent);
  font-size:1.25rem; font-weight:800; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.hold em{font-style:normal; font-size:2.6rem; line-height:1}
.hold svg{position:absolute; inset:-12px; width:calc(100% + 24px); height:calc(100% + 24px); transform:rotate(-90deg); pointer-events:none}
.hold circle{fill:none; stroke-width:8}
.hold .trk{stroke:var(--line)}
.hold .rng{stroke:var(--gold); stroke-linecap:round; stroke-dasharray:289; stroke-dashoffset:289}
.hold{--p:0; transform:scale(calc(1 - var(--p) * .05))}
.hold::after{content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:conic-gradient(rgba(255,255,255,.28) calc(var(--p) * 360deg), transparent 0)}
.hold em,.hold .hl{position:relative; z-index:1}
.hold.full{animation:popin .25s cubic-bezier(.3,1.9,.5,1)}
.hold.small{width:150px; height:150px; font-size:1rem}

/* pin */
.dots{display:flex; gap:16px}
.dots i{width:22px; height:22px; border-radius:50%; border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pad{display:grid; grid-template-columns:repeat(3,84px); gap:14px; justify-content:center}
.pad button{height:84px; border-radius:50%; border:2px solid var(--line); background:var(--surface); font-size:1.8rem; font-weight:800}
.pad button:active{background:var(--tint)}

/* presents */
.gifts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.gift{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:92px; padding:8px 4px;
  border-radius:16px; border:2px solid var(--line); background:var(--surface); color:var(--ink);
}
.gift b{font-size:2.3rem; line-height:1.1; font-weight:400}
.gift span{font-size:.85rem; font-weight:700; text-align:center; line-height:1.2}
.gift b svg{display:block; width:2.5rem; height:3.1rem}
.huge svg{width:5.5rem; height:6.9rem}
.seg.four button:nth-child(n+3){border-top:2px solid var(--ink)}
button.gift.on{border-color:var(--gold); background:var(--tint); box-shadow:0 0 0 3px var(--gold)}

.nums{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.nums button{min-height:58px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums}
.nums button.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.nums button:disabled{opacity:.3; text-decoration:line-through; cursor:default}

.bld{background:#2A3442; border-top:12px solid #19202A; border-radius:16px 16px 6px 6px; padding:16px 14px 0}
.wins{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:10px}
.win{position:relative; aspect-ratio:5/6; padding:0; border:3px solid #C9D2DC; border-radius:6px; background:#141C26; overflow:hidden; display:block}
.win.lit{background:#F3CF73} .win.cool{background:#A9D3E0} .win.dim{background:#8A6B3C}
.win::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(#C9D2DC,#C9D2DC) center/3px 100% no-repeat, linear-gradient(#C9D2DC,#C9D2DC) center/100% 3px no-repeat}
.win .cl,.win .cr{position:absolute; top:0; bottom:0; width:27%; background:#A8475A}
.win .cl{left:0} .win .cr{right:0}
.win em{position:absolute; left:0; right:0; bottom:2px; text-align:center; font-style:normal; font-size:1.15rem; line-height:1}
.win svg{position:absolute; left:15%; width:70%; bottom:0; height:auto}
.win svg.h{left:0; top:0; bottom:auto; width:100%; height:100%}
.win .bl{animation:blink 5s infinite; animation-delay:var(--d)}
.win .sw{animation:sway 4s ease-in-out infinite; animation-delay:var(--d)}
.win .gl{position:absolute; left:40%; top:42%; width:5px; height:5px; border-radius:50%; background:#fff; opacity:0; animation:glint 7s infinite; animation-delay:var(--d)}
.win.tw .cr{animation:twitch 8s infinite; animation-delay:var(--d)}
.win.flick{animation:flick 3.4s infinite; animation-delay:var(--d)}
.win.on{box-shadow:0 0 0 4px var(--gold); background:#3B4B5F}
.win.open{background:#0B1017; border-style:dashed; opacity:.9}
.win.open::after{display:none}
.win:disabled{cursor:default}
.door{width:48px; height:52px; margin:16px auto 0; background:#6B4A32; border:3px solid #C9D2DC; border-bottom:0; border-radius:6px 6px 0 0}
.peek{width:150px; aspect-ratio:5/6; position:relative; border:4px solid #C9D2DC; border-radius:8px; background:#0B1017; display:flex; align-items:center; justify-content:center; font-size:4rem}
.peek svg{width:74%; height:auto}
@keyframes blink{0%,88%,100%{opacity:1} 92%{opacity:0}}
@keyframes sway{0%,100%{transform:translateX(-2px)} 50%{transform:translateX(2px)}}
@keyframes glint{0%,90%,100%{opacity:0} 94%{opacity:.8}}
@keyframes twitch{0%,91%,100%{transform:none} 95%{transform:translateX(-3px)}}
@keyframes flick{0%,38%,50%,58%,100%{background:#F3CF73} 42%,54%{background:#141C26}}
@media (prefers-reduced-motion: reduce){.win .gl{animation:none; opacity:.35} .win.flick,.win .bl,.win .sw,.burst,.sky .st,.balloon svg,.sig.wait,.dial.hid .dtrk,.dial.hid #clock,.shake,.pad2.won{animation:none}}

.grid{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:6px}
.gc{aspect-ratio:1; padding:0; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-weight:800; line-height:1;
  font-size:clamp(1rem, calc(56vw / var(--c)), 3.4rem); display:flex; align-items:center; justify-content:center}
.gc.p0{color:var(--accent)} .gc.p1{color:var(--green)}
.grid.four{background:var(--tint); padding:8px; border-radius:16px}
.grid.four .gc{border-radius:50%}
.grid.four .gc.p0{background:var(--accent); border-color:var(--accent)}
.grid.four .gc.p1{background:var(--gold); border-color:var(--gold)}
.gc.hit{box-shadow:0 0 0 4px var(--ink)}
.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.card{aspect-ratio:3/4; padding:0; border:2px solid var(--ink); border-radius:12px; background:var(--ink); color:var(--bg); font-size:2rem; font-weight:800; display:flex; align-items:center; justify-content:center}
.card.up{background:var(--surface); border-color:var(--line); font-size:2.4rem}
.card.gone{background:var(--tint); border-color:var(--tint); opacity:.45}
.word{display:flex; flex-wrap:wrap; gap:6px 6px; justify-content:center; font-size:1.9rem; font-weight:800; line-height:1.2}
.word span{min-width:1.05em; text-align:center; border-bottom:3px solid var(--ink)}
.word span.sp{border:0; min-width:.7em}
.keys{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.keys button{min-height:52px; padding:0; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-size:1.2rem; font-weight:800}
.keys button.ok{background:var(--green); border-color:var(--green); color:var(--bg); opacity:1}
.keys button:disabled{opacity:.3; cursor:default}
.keys button.ok:disabled{opacity:1}
.snow{width:150px; height:180px}
.snow *{fill:var(--surface); stroke:var(--ink); stroke-width:3; stroke-linecap:round}
.snow .dk{fill:var(--ink)} .snow .nose{fill:#EE7F2D; stroke:none}

.sky{position:relative; height:52vh; min-height:330px; border-radius:18px; overflow:hidden; display:grid; grid-template-columns:repeat(var(--c),1fr);
  background:linear-gradient(#070A1C,#1A2452 70%,#2A2F66)}
.lane{position:relative; border-left:1px dashed rgba(255,255,255,.12)}
.lane:first-child{border-left:0}
.rocket{position:absolute; left:0; top:0; width:28px; height:28px; font-size:26px; line-height:28px; text-align:center; opacity:0; will-change:transform; pointer-events:none}
#skyfx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
@keyframes glowpulse{from{filter:brightness(1)} to{filter:brightness(1.5)}}
.burst{position:absolute; left:50%; width:10px; height:10px; margin:0 0 -5px -5px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px var(--pc), 0 0 14px 6px var(--pc); animation:boom .35s ease-out both, glowpulse 1.6s ease-in-out .35s infinite alternate}
.burst.best{width:14px; height:14px; margin:0 0 -7px -7px; box-shadow:0 0 0 4px var(--pc), 0 0 22px 10px #FFD166}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}
.lane .alt{position:absolute; left:0; right:0; margin-bottom:-34px; text-align:center; color:#fff; font-size:.8rem; font-weight:800}
@keyframes boom{from{transform:scale(3); opacity:.2} to{transform:scale(1); opacity:1}}
.pads{display:grid; grid-template-columns:repeat(var(--c),1fr); gap:8px}
.pad2{min-height:64px; padding:6px 4px; border-radius:14px; border:3px solid var(--pc); background:var(--surface); font-weight:800; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; touch-action:manipulation}
.pads.big .pad2{min-height:110px; font-size:1.25rem; background:var(--pc); color:#10161E}
.pad2:disabled{opacity:.35}
.sig{min-height:150px; border-radius:18px; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; font-size:2.2rem; font-weight:800; background:var(--tint)}
.sig.wait{background:#7A1C22; color:#fff; animation:beat .9s ease-in-out infinite}
.sig.fake{background:#D99A1C; color:#10161E; animation:shake .4s}
.sig.go{background:#1F9D5B; color:#fff; font-size:3.4rem; animation:popin .3s cubic-bezier(.3,1.9,.5,1)}
.sig.wait::after{content:"..."; display:inline-block; width:1.2em; text-align:left; overflow:hidden; animation:dots 1.2s steps(4,end) infinite}
.pad2.won{animation:won .5s ease-in-out 4 alternate; box-shadow:0 0 0 5px var(--gold)}
.pad2.nope{animation:shake .4s}
.pad2.lost{opacity:.4}
.balloonbox{height:330px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px}
.balloon{width:72px; transform:scale(var(--s)); transform-origin:50% 88%; transition:transform .5s cubic-bezier(.3,1.9,.5,1)}
.balloon svg{display:block; width:100%; height:auto; transform-origin:50% 90%; animation:sway var(--w,2.4s) ease-in-out infinite alternate}
.popword{font-size:5rem; font-weight:800; color:var(--accent); letter-spacing:-.02em; align-self:center; animation:popword .45s cubic-bezier(.3,2,.5,1) both; transform-origin:50% 60%}
.sky .st,.night .st{position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:twinkle 2.4s ease-in-out infinite alternate; animation-delay:var(--d)}
.sky .moon,.night .moon{position:absolute; right:9%; top:7%; width:38px; height:38px; border-radius:50%; background:#F4EBC8; box-shadow:0 0 22px 6px rgba(244,235,200,.35), inset -9px -5px 0 0 #D9CFA8}
.sky .city{position:absolute; left:0; right:0; bottom:0; width:100%; height:44px}
.sky::after{content:""; position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.sky.flash::after{animation:skyflash .4s ease-out}
.shake{animation:shake .45s}
.dial{position:relative; width:240px; height:240px; display:flex; align-items:center; justify-content:center}
.dial svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.dial circle{fill:none; stroke-width:9}
.dial .dtrk{stroke:var(--line)}
.dial .darc{stroke:var(--accent); stroke-linecap:round; stroke-dasharray:339.3; stroke-dashoffset:339.3; transition:opacity .4s}
.dial.hid .darc{opacity:0}
.dial.hid .dtrk{stroke-dasharray:3 12; stroke-linecap:round; transform-origin:60px 60px; animation:spin 4s linear infinite}
.dial.hid #clock{animation:beat .7s ease-in-out infinite; color:var(--muted)}
.gauge{position:relative; height:34px; border-radius:17px; background:linear-gradient(90deg,var(--tint),var(--surface) 50%,var(--tint)); border:2px solid var(--line); width:100%}
.gauge .mid{position:absolute; left:50%; top:-6px; bottom:-6px; width:4px; margin-left:-2px; border-radius:2px; background:var(--green)}
.gauge .mk{position:absolute; left:0; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--pc,var(--accent)); border:3px solid var(--surface); box-shadow:0 0 0 2px var(--ink); transition:left .9s cubic-bezier(.2,1.3,.4,1)}
.gends{display:flex; justify-content:space-between; width:100%; font-size:.85rem; color:var(--muted); font-weight:700}
.grow{display:grid; grid-template-columns:5.5em 1fr 3.4em; align-items:center; gap:10px; font-weight:700}
.grow span:last-child{text-align:right; font-variant-numeric:tabular-nums}
@keyframes twinkle{from{opacity:.25; transform:scale(.8)} to{opacity:1; transform:scale(1.4)}}
@keyframes skyflash{from{opacity:.35} to{opacity:0}}
@keyframes wiggle{from{transform:rotate(-48deg)} to{transform:rotate(-42deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,2px)} 40%{transform:translate(5px,-2px)} 60%{transform:translate(-4px,-1px)} 80%{transform:translate(3px,1px)}}
@keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.04)}}
@keyframes popin{from{transform:scale(.5)} to{transform:scale(1)}}
@keyframes dots{from{width:0} to{width:1.2em}}
@keyframes won{from{transform:scale(1)} to{transform:scale(1.07)}}
@keyframes sway{from{transform:rotate(-3deg)} to{transform:rotate(3deg)}}
@keyframes popword{from{transform:scale(.2) rotate(-14deg); opacity:0} to{transform:scale(1) rotate(-6deg); opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fair{position:relative; height:46vh; min-height:330px; border-radius:18px; overflow:hidden; background:linear-gradient(#4FB3E8,#A8DCF5 60%,#E4F4D8 61%,#BFE3A8)}
#balfx{position:absolute; inset:0; width:100%; height:100%}
.three{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}

/* Find the agent: night scene */
.night{position:relative; border-radius:18px; overflow:hidden; padding:70px 16px 0; background:linear-gradient(#070A1C,#1A2452 72%,#2B3068)}
.night.dusk{background:linear-gradient(#1B1F4A,#6A4C7D 70%,#C9806B)}
.night .moon{right:11%; top:10px; width:30px; height:30px}
.night .cld{position:absolute; left:-110px; width:96px; height:24px; border-radius:20px; background:rgba(255,255,255,.09); filter:blur(3px); animation:drift 46s linear infinite; animation-delay:var(--d)}
.night .beam{position:absolute; left:4%; top:150px; width:150%; height:70px; transform-origin:0 50%; pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,220,.3),rgba(255,255,220,0) 70%); clip-path:polygon(0 46%,100% 0,100% 100%,0 54%); animation:sweep 8s ease-in-out infinite alternate}
.night .beam.b2{left:auto; right:4%; transform-origin:100% 50%; background:linear-gradient(270deg,rgba(210,230,255,.22),rgba(210,230,255,0) 70%); clip-path:polygon(100% 46%,0 0,0 100%,100% 54%); animation:sweep2 11s ease-in-out infinite alternate}
.roof{position:relative; height:0; z-index:1}
.roof i{position:absolute; bottom:0}
.roof .ant{left:20%; width:2px; height:36px; background:#8792A0}
.roof .ant::after{content:""; position:absolute; top:-5px; left:-3px; width:8px; height:8px; border-radius:50%; background:#FF4D4D; box-shadow:0 0 9px 3px rgba(255,77,77,.8); animation:led 1.6s steps(1) infinite}
.roof .tank{right:15%; width:36px; height:22px; background:#3A2E2A; border-radius:5px 5px 0 0; border-bottom:6px solid #241C1A}
.roof .chim{left:57%; width:14px; height:18px; background:#4A3531}
.roof .chim b{position:absolute; left:1px; top:-8px; width:12px; height:12px; border-radius:50%; background:rgba(205,210,220,.4); animation:smoke 4.2s linear infinite}
.roof .chim b:nth-child(2){animation-delay:-1.4s} .roof .chim b:nth-child(3){animation-delay:-2.8s}
.night .bld{position:relative; border-radius:5px 5px 0 0; border-top:12px solid #1B1620; padding:18px 14px 0;
  background:linear-gradient(90deg,rgba(0,0,0,.34),transparent 13%,transparent 87%,rgba(0,0,0,.34)),
    repeating-linear-gradient(0deg,transparent 0 13px,rgba(0,0,0,.24) 13px 14px), repeating-linear-gradient(90deg,transparent 0 27px,rgba(0,0,0,.15) 27px 28px), #40313B}
.night .door{position:relative; box-shadow:0 -6px 22px 4px rgba(255,214,130,.28); background:linear-gradient(90deg,#5C3F2B,#7A553A 50%,#5C3F2B)}
.night .door::before{content:""; position:absolute; top:-15px; left:50%; width:12px; height:8px; margin-left:-6px; border-radius:6px 6px 2px 2px; background:#FFE7A3; box-shadow:0 0 12px 5px rgba(255,220,130,.5)}
.night .door::after{content:""; position:absolute; right:7px; top:26px; width:5px; height:5px; border-radius:50%; background:#E0B24A}
.street{position:relative; height:24px; margin:0 -16px; background:linear-gradient(#1A1D2B,#0D0F18)}
.street .lamp{position:absolute; left:5px; bottom:10px; width:4px; height:78px; background:#20242F}
.street .lamp::after{content:""; position:absolute; top:-7px; left:-7px; width:18px; height:9px; border-radius:9px 9px 3px 3px; background:#FFE7A3; box-shadow:0 0 26px 13px rgba(255,220,130,.3); animation:lampf 6s infinite}
.night .win{box-shadow:0 5px 0 -1px #8E99A6, inset 0 0 0 1px rgba(0,0,0,.35)}
.night .win.lit{box-shadow:0 5px 0 -1px #8E99A6, 0 0 13px 1px rgba(243,207,115,.38)}
.night .win.dim{box-shadow:0 5px 0 -1px #8E99A6, 0 0 9px 0 rgba(180,140,80,.25)}
.night .win.cool{box-shadow:0 5px 0 -1px #8E99A6, 0 0 13px 1px rgba(150,205,230,.35); animation:tv 3.3s steps(1) infinite; animation-delay:var(--d)}
.night .win::before{content:""; position:absolute; top:-20%; bottom:-20%; left:0; width:42%; z-index:2; pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent); transform:translateX(-170%) skewX(-18deg); animation:sheen 12s infinite; animation-delay:var(--d)}
.night .win::after{z-index:3}
.night .win .cl,.night .win .cr{background:repeating-linear-gradient(90deg,#A8475A 0 5px,#8E3A4C 5px 7px); z-index:1}
.night .win .cl{transform-origin:0 0} .night .win .cr{transform-origin:100% 0}
.night .win.brz .cl{animation:breezeL 3.4s ease-in-out infinite alternate; animation-delay:var(--d)}
.night .win.brz .cr{animation:breezeR 3.4s ease-in-out infinite alternate; animation-delay:var(--d)}
.night .win .walk{position:absolute; bottom:0; left:0; width:36%; height:74%; border-radius:46% 46% 8% 8%; background:rgba(20,28,38,.5); filter:blur(1.5px); transform:translateX(-150%); animation:walk 14s linear infinite; animation-delay:var(--d)}
.night .win.plan{background:#232B4A; box-shadow:0 5px 0 -1px #8E99A6}
.night .win.plan::before{display:none}
.night .win.plan.on{background:#3B4B5F; box-shadow:0 0 0 4px var(--gold), 0 0 18px 6px rgba(217,154,28,.5); animation:beat .9s ease-in-out infinite}
.night .win.plan.on::before{content:"🕵️"; display:flex; align-items:center; justify-content:center; inset:0; width:auto; background:none; transform:none; font-size:1.5rem; animation:popin .3s cubic-bezier(.3,1.9,.5,1)}
.night .win.open{box-shadow:none}
.night .win.open::before{display:none}
.night .win.opening{z-index:6; animation:openwin .5s ease-in forwards}
.night .win.opening .cl{transform:translateX(-95%); transition:transform .35s ease-in}
.night .win.opening .cr{transform:translateX(95%); transition:transform .35s ease-in; animation:none}
.ey{transform-box:fill-box; transform-origin:center; animation:blink2 4.2s infinite}
.peek{width:176px; overflow:hidden; box-shadow:0 0 0 6px #40313B, 0 0 40px 10px rgba(243,207,115,.25); background:radial-gradient(circle at 50% 45%,#3A3550,#0B1017 75%)}
.peek .pk{display:flex; align-items:center; justify-content:center; width:100%; height:100%; animation:popin .45s cubic-bezier(.3,1.8,.5,1) .28s both}
.peek .pk span{display:inline-block; animation:bobble 1.5s ease-in-out infinite alternate}
.peek .pl,.peek .pr{position:absolute; top:0; bottom:0; width:52%; z-index:1; background:repeating-linear-gradient(90deg,#A8475A 0 9px,#8E3A4C 9px 13px); animation:partL .55s cubic-bezier(.5,0,.3,1) .05s both}
.peek .pl{left:0} .peek .pr{right:0; animation-name:partR}
.caught{position:relative; width:100%; height:240px; border-radius:18px; overflow:hidden; background:linear-gradient(#070A1C,#1A2452 80%,#2B3068)}
.caught .cone{position:absolute; left:50%; top:-12px; width:340px; height:300px; margin-left:-170px; transform-origin:50% 0; animation:conesway 2.6s ease-in-out infinite alternate;
  background:conic-gradient(from 158deg at 50% 0,transparent 0deg,rgba(255,255,215,.55) 7deg,rgba(255,255,215,.55) 37deg,transparent 44deg)}
.caught .pool{position:absolute; left:50%; bottom:10px; width:150px; height:26px; margin-left:-75px; border-radius:50%; background:rgba(255,255,215,.35); filter:blur(4px)}
.caught .spy{position:absolute; left:0; right:0; bottom:26px; text-align:center; font-size:5.2rem; line-height:1; animation:popin .55s cubic-bezier(.3,1.9,.5,1) .15s both}
.caught .spy span{display:inline-block; animation:bobble 1.2s ease-in-out .7s infinite alternate}
@keyframes drift{to{transform:translateX(560px)}}
@keyframes sweep{from{transform:rotate(-78deg)} to{transform:rotate(-38deg)}}
@keyframes sweep2{from{transform:rotate(70deg)} to{transform:rotate(34deg)}}
@keyframes led{0%,55%{opacity:1} 56%,100%{opacity:.15}}
@keyframes smoke{from{transform:translate(0,0) scale(.6); opacity:.55} to{transform:translate(16px,-46px) scale(2.2); opacity:0}}
@keyframes lampf{0%,91%,95%,100%{opacity:1} 93%{opacity:.55}}
@keyframes tv{0%,100%{background:#A9D3E0} 18%{background:#8FC0DA} 37%{background:#C9E6EE} 52%{background:#7FB2D0} 71%{background:#B6DBE6} 86%{background:#96C6DC}}
@keyframes sheen{0%,82%{transform:translateX(-170%) skewX(-18deg)} 94%,100%{transform:translateX(340%) skewX(-18deg)}}
@keyframes breezeL{from{transform:skewX(-3deg) scaleX(.9)} to{transform:skewX(5deg) scaleX(1.12)}}
@keyframes breezeR{from{transform:skewX(3deg) scaleX(.9)} to{transform:skewX(-5deg) scaleX(1.12)}}
@keyframes walk{0%,68%{transform:translateX(-150%)} 84%,100%{transform:translateX(330%)}}
@keyframes openwin{0%{transform:scale(1); filter:brightness(1)} 70%{transform:scale(1.38); filter:brightness(1.25)} 100%{transform:scale(1.5); filter:brightness(2.2); opacity:.9}}
@keyframes blink2{0%,91%,100%{transform:scaleY(1)} 94%,96%{transform:scaleY(.08)}}
@keyframes bobble{from{transform:translateY(3px) rotate(-3deg)} to{transform:translateY(-4px) rotate(3deg)}}
@keyframes partL{from{transform:translateX(0)} to{transform:translateX(-78%)}}
@keyframes partR{from{transform:translateX(0)} to{transform:translateX(78%)}}
@keyframes conesway{from{transform:rotate(-7deg)} to{transform:rotate(7deg)}}
@media (prefers-reduced-motion: reduce){.night .cld,.night .beam,.roof .chim b,.roof .ant::after,.night .win.cool,.night .win::before,.night .win.brz .cl,.night .win.brz .cr,.night .win .walk,.night .win.plan.on,.ey,.peek .pk span,.caught .cone,.caught .spy span{animation:none}}

/* clock and scores */
.clock{display:flex; flex-direction:column; gap:12px; align-items:stretch; text-align:center}
#clock{font-size:4.2rem; line-height:1; font-weight:800; font-variant-numeric:tabular-nums; padding:8px 0}
.clock.done #clock{color:var(--accent)}
.board{width:100%; border-collapse:collapse; font-size:1.1rem}
.board td{padding:10px 4px; border-top:2px solid var(--line)}
.board tr:first-child td{border-top:0}
.board td:last-child{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
.ver{color:var(--muted); font-size:.8rem; text-align:center; opacity:.8}
ol.steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:8px}
#toast{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:88vw;
  background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:26px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

// Every player who knows the word gets a clue nobody else has: two descriptions first, then facts about the word itself.
function impClues(e, n){
  const w = e[0], L = [...w].filter(isLetter).map(flat), len = L.length, words = w.trim().split(/\s+/).length;
  const cat = Object.keys(WORDS).find(c => WORDS[c].easy.includes(e) || WORDS[c].hard.includes(e));
  const v = L.filter(x => 'AEIOU'.includes(x)).length, ord = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth', 'eleventh', 'twelfth'];
  const out = [e[1]];
  if (CLUE2[w]) out.push(CLUE2[w]);
  if (cat) out.push(`You would find it under "${cat}".`);
  out.push(`It starts with the letter ${L[0]}.`);
  out.push(words > 1 ? `It is ${words} words, with ${len} letters in all.` : `It has ${len} letters.`);
  out.push(`It ends with the letter ${L[len - 1]}.`);
  out.push(`It has ${v} vowel${v === 1 ? '' : 's'}.`);
  out.push(L.some((x, i) => i && x === L[i - 1]) ? 'It has a double letter in it.' : new Set(L).size === len ? 'No letter appears in it twice.' : 'One of its letters appears more than once.');
  out.push(L[0] <= 'M' ? 'In the dictionary it sits in the first half, A to M.' : 'In the dictionary it sits in the second half, N to Z.');
  if (len >= 4) { let j = shuffle(L), k = 0; while (j.join('') === L.join('') && k++ < 8) j = shuffle(L); out.push(`Its letters, jumbled up: ${j.join('')}`); }
  for (let i = 1; i < len - 1 && i < ord.length; i++) out.push(`Its ${ord[i]} letter is ${L[i]}.`);
  out.push(`Its letters in alphabetical order: ${L.slice().sort().join('')}`, `It has ${len - v} consonant${len - v === 1 ? '' : 's'}.`, `Spelled backwards it reads ${L.slice().reverse().join('')}.`);
  const uniq = out.filter((x, i) => out.indexOf(x) === i && x !== e[2]);
  return uniq.slice(0, n);
}

// Everyone gives to the next person in one random loop, so nobody can draw themselves.
function drawPairs(names){
  const r = names.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = rnd(i); [r[i], r[j]] = [r[j], r[i]]; }
  return names.map((g, i) => ({g, r: r[i]}));
}

    `<button class="btn quiet" data-act="resetScores" data-k="${key}" data-confirm="Tap again to clear the scores">Clear the scores</button></section>`;
}
const againBtns = game =>
  `<button class="btn" data-act="again">Play again with the same players</button>` +
  `<button class="btn alt" data-act="open" data-g="${game}">Change players or settings</button>` +
  `<button class="btn quiet" data-act="nav" data-to="home">Back to all games</button>`;

/* ---------- player picker ---------- */
function pool(){
  const out = [];
  [...S.santa.people.map(p => p.name), ...S.extras].forEach(n => { if (!has(out, n)) out.push(n); });
  return out;
}
function selected(){
  const p = pool();
  if (!S.selected) return p.filter(n => S.santa.people.some(x => x.name === n));
  return p.filter(n => S.selected.includes(n));
}

/* Werewolf */
V.wolf = () => {
  const alive = G.players.filter((_, i) => !G.out.includes(i));
  const wolves = G.players.filter((_, i) => !G.out.includes(i) && G.roles[i] === 'wolf').length;
  const others = alive.length - wolves;
  const win = wolves === 0 ? 'The villagers win' : wolves >= others ? 'The werewolves win' : '';
  const hard = G.roles.includes('seer');
  const steps = ['Everyone closes their eyes.', '"Werewolves, wake up and point at one villager." Then they sleep again.'];
  if (hard) steps.push('"Seer, wake up and point at one player." Nod if that player is a werewolf.');
  if (G.roles.includes('doctor')) steps.push('"Doctor, wake up and point at one player to protect."');
  steps.push('"Everyone wake up." Say who was caught in the night and tap their name below.' + (G.roles.includes('doctor') ? ' Nobody is caught if the doctor protected them.' : ''));
  steps.push('Everyone talks it over, then votes one player out. Tap their name.');
  let h = win ? `<div class="center"><p class="tag good">${win}</p></div>` : '';
  h += `<section><h2>Each round</h2><p class="muted">Pick a narrator to read these out. A narrator who is not playing can hold the button further down to see every role.</p>` +
    `<ol class="steps">${steps.map(s => `<li>${s}</li>`).join('')}</ol></section>`;
  h += `<section><h2>Players</h2><p class="muted">${alive.length} still in. Tap a name when that player is out.</p>` +
    `<div class="list">${G.players.map((n, i) => `<button class="row${G.out.includes(i) ? ' out' : ''}" data-act="wolfOut" data-i="${i}" aria-pressed="${G.out.includes(i)}"><span>${esc(n)}</span>` +

  h += `<section><h2>Daytime talk</h2>${clock()}</section>`;
  h += `<section><h2>Roles</h2>${view.roles ? `<button class="btn alt" data-act="hideRoles">Hide the roles</button>`

  h += `<section>${againBtns('wolf')}</section>`;
  return page('Werewolf', h, 'home', true);
};

/* Find the agent */
const agGuessers = () => G.players.slice(G.chooser + 1).concat(G.players.slice(0, G.chooser));
// A resident's eyes drift towards the agent's window. dx and dy are -1 to 1.
const faceSVG = (dx, dy, asleep) => `<svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 34c0-8 5-11 12-11s12 3 12 11z" fill="#4E7FA8"/><circle cx="15" cy="14" r="9.5" fill="#E7B98C"/>` +

const SIL = `<svg viewBox="0 0 30 34" aria-hidden="true"><path d="M3 34c0-8 5-11 12-11s12 3 12 11z" fill="#141C26"/><circle cx="15" cy="14" r="8" fill="#141C26"/><path d="M6 10h18l-3-3H9z" fill="#141C26"/></svg>`;
// Red herrings: each looks like someone hiding, and turns out to be something ordinary.
const H = (body) => `<svg class="h" viewBox="0 0 50 60" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;
const HER = {
  shoes: {set: {bg: 'lit', curt: true}, vis: H('<ellipse cx="4.5" cy="57" rx="3.4" ry="2.2" fill="#15110E"/><ellipse cx="10.5" cy="57" rx="3.4" ry="2.2" fill="#15110E"/>'),

    inside: ['🦉', 'A toy owl with glow-in-the-dark eyes.']},
  scope: {set: {bg: 'cool', curt: false}, vis: H('<path d="M17 47L37 37" stroke="#1B222C" stroke-width="4.5" stroke-linecap="round"/><path d="M26 44l-5 14M26 44l6 14" stroke="#1B222C" stroke-width="1.6"/>'),

    inside: ['🎈', 'A balloon left over from a party, bobbing about.']},
  paper: {set: {bg: 'lit', curt: false}, vis: H('<rect x="11" y="17" width="28" height="27" fill="#ECE8DC"/><path d="M14 36h22M14 39h22M14 42h14" stroke="#9A958A" stroke-width="1"/><circle cx="20" cy="26" r="1.9" fill="#141C26"/><circle cx="30" cy="26" r="1.9" fill="#141C26"/>'),
    inside: ['📰', 'Grandad behind his newspaper. The holes are from moths.']},
  glove: {set: {bg: 'dim', curt: true}, vis: H('<path d="M33 27h5v8h-5a3 3 0 0 1 0-8z" fill="#E7B98C"/><path d="M33 29h4M33 31h4M33 33h4" stroke="#B98A61" stroke-width=".7"/>'),
    inside: ['🧤', 'A rubber glove pegged to the curtain to dry.']}
};
function agInside(c){
  if (c.her) return [`<span aria-hidden="true">${HER[c.her].inside[0]}</span>`, HER[c.her].inside[1]];
  if (c.sil) return ['<span aria-hidden="true">🧥</span>', 'Only a coat and hat on a stand.'];
  if (c.deco === 'cat') return ['<span aria-hidden="true">🐈</span>', 'Only the cat.'];
  if (c.res === 'asleep') return [faceSVG(0, 0, true), 'Someone fast asleep. Not the agent.'];
  if (c.res) return [faceSVG(c.dx, c.dy), 'Someone is home, but it is not the agent.'];
  if (c.deco === 'plant') return ['<span aria-hidden="true">🪴</span>', 'Just a pot plant.'];
  return ['', 'An empty room.'];
}
function agBuild(pos){
  const hard = G.cols === 5, n = G.cols * G.rows, bgs = ['', '', 'lit', 'lit', 'cool', 'dim'];
  const ar = Math.floor(pos / G.cols), ac = pos % G.cols;
  const cells = Array.from({length: n}, (_, i) => {
    const r = Math.floor(i / G.cols), c = i % G.cols, len = Math.hypot(ac - c, ar - r) || 1;
    const deco = [null, null, null, 'plant', 'cat'][rnd(5)];
    return {bg: bgs[rnd(bgs.length)], curt: Math.random() < .5, deco, res: deco === 'cat' ? null : Math.random() < .55 ? (hard && Math.random() < .3 ? 'asleep' : 'awake') : null,
      dx: (ac - c) / len, dy: (ar - r) / len, d: (-Math.random() * 8).toFixed(1), open: false};
  });
  Object.assign(cells[pos], {curt: true, tw: true, gl: true, deco: null, res: null, bg: bgs[rnd(bgs.length)]});
  const rest = shuffle(cells.map((_, i) => i).filter(i => i !== pos));
  let k = 0;
  const take = (count, props) => { for (let j = 0; j < count; j++) Object.assign(cells[rest[k++]], props); };
  take(hard ? 3 : 2, {sil: true, bg: 'lit', curt: false, deco: null, res: null});   // a figure that turns out to be a coat stand
  take(hard ? 2 : 1, {flick: true, bg: 'lit'});
  shuffle(Object.keys(HER)).slice(0, hard ? 5 : 3).forEach(h => take(1, Object.assign({her: h, deco: null, res: null}, HER[h].set)));                                        // a light on the blink
  if (hard) { take(2, {tw: true, curt: true}); take(1, {gl: true}); }                 // half of the real giveaway, never both
  let brz = hard ? 2 : 1;                                                              // curtains stirring in a breeze: slow and steady, unlike the agent's quick twitch
  cells.forEach((c, i) => { if (brz > 0 && i !== pos && c.curt && !c.tw && !c.her && !c.sil) { c.brz = true; brz--; } });
  return cells;
}
function agBuilding(play){
  const cell = (c, i) => {
    const lab = `Window ${i % G.cols + 1}, floor ${G.rows - Math.floor(i / G.cols)}`;
    if (!play) return `<button class="win plan${view.pick === i ? ' on' : ''}" data-act="agSet" data-i="${i}" aria-label="${lab}"></button>`;
    if (c.open) return `<button class="win open" disabled aria-label="${lab}, already checked">${agInside(c)[0].replace('<span', '<em').replace('</span>', '</em>')}</button>`;
    return `<button class="win ${c.bg}${c.flick ? ' flick' : ''}${c.tw ? ' tw' : ''}${c.brz ? ' brz' : ''}" style="--d:${c.d}s" data-act="agGuess" data-i="${i}" aria-label="${lab}">` +
      (c.res === 'awake' && (c.bg === 'lit' || c.bg === 'dim') && !c.sil && !c.her && !c.flick ? '<u class="walk"></u>' : '') + (c.curt ? '<i class="cl"></i><i class="cr"></i>' : '') + (c.sil ? SIL : '') + (c.her ? HER[c.her].vis : '') + (c.deco ? `<em aria-hidden="true">${c.deco === 'cat' ? '🐈' : '🪴'}</em>` : '') + (c.gl ? '<b class="gl"></b>' : '') + `</button>`;
  };
  const cells = play ? G.cells : Array.from({length: G.cols * G.rows});
  const stars = [[6,8],[17,22],[29,6],[41,16],[55,9],[66,24],[78,5],[91,19],[12,36],[86,40]].map((p, i) => `<i class="st" style="left:${p[0]}%;top:${p[1] * 1.6}px;--d:-${(i * .41 % 2.4).toFixed(2)}s"></i>`).join('');
  return `<div class="night${play ? '' : ' dusk'}">${stars}<i class="moon"></i><i class="cld" style="top:18px;--d:-9s"></i><i class="cld" style="top:44px;--d:-31s"></i>` +
    (play ? `<i class="beam"></i><i class="beam b2"></i>` : '') + `<div class="roof"><i class="ant"></i><i class="tank"></i><i class="chim"><b></b><b></b><b></b></i></div>` +
    `<div class="bld"><div class="wins" style="--c:${G.cols}">${cells.map(cell).join('')}</div><div class="door"></div></div><div class="street"><i class="lamp"></i></div></div>`;
}
V.agent = () => {

/* ----- Two-player classics ----- */
// With more than two players the winner stays on and the next player steps in.
const duelPeek = loser => G.bench.length ? [G.pair[1 - Math.max(loser, 0)], G.bench[0]] : [G.pair[1], G.pair[0]];
function duelNext(loser){
  if (G.bench.length) { const l = Math.max(loser, 0); G.bench.push(G.pair[l]); G.pair = [G.pair[1 - l], G.bench.shift()]; }
  else G.pair.reverse();
}
const duelBtns = (loser, key) => { const nx = duelPeek(loser);
  return `<button class="btn" data-act="duelAgain">Next game: ${esc(nx[0])} v ${esc(nx[1])}</button>` +
    `<button class="btn quiet" data-act="open" data-g="${G.type}">Change players or settings</button>` + board(key); };

/* Noughts and crosses, and Four in a row */
function gridNew(){
  const hard = S.level === 'hard';
  Object.assign(G, G.type === 'four' ? {w: hard ? 9 : 7, h: hard ? 7 : 6, k: hard ? 5 : 4} : {w: hard ? 5 : 3, h: hard ? 5 : 3, k: hard ? 4 : 3});
  G.cells = Array(G.w * G.h).fill(null); G.turn = 0; G.done = false; G.hit = []; G.winner = -1;
}
function gridWin(i){
  const x = i % G.w, y = Math.floor(i / G.w), p = G.cells[i];
  for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
    const line = [i];
    for (const sg of [1, -1]) { let cx = x + dx * sg, cy = y + dy * sg;
      while (cx >= 0 && cx < G.w && cy >= 0 && cy < G.h && G.cells[cy * G.w + cx] === p) { line.push(cy * G.w + cx); cx += dx * sg; cy += dy * sg; } }
    if (line.length >= G.k) return line;
  }
  return null;
}
V.grid = () => {

    `<p class="muted">${esc(G.pair[0])} is ${mark[0]}, ${esc(G.pair[1])} is ${mark[1]}. ${G.k} in a row wins.${four ? ' Tap a column to drop a counter.' : ''}</p>` +

/* Hangman, drawn as a snowman that gets built with each wrong guess */
const isLetter = ch => /\p{L}/u.test(ch);
const flat = ch => ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const hangGuessers = () => G.auto ? G.players : G.players.slice(G.setter + 1).concat(G.players.slice(0, G.setter));
function snowman(stage){
  const parts = ['<circle cx="50" cy="96" r="21"/>', '<circle cx="50" cy="63" r="15"/>', '<circle cx="50" cy="40" r="11"/>', '<path d="M36 60L18 47"/>', '<path d="M64 60L82 47"/>',
    '<circle class="dk" cx="46" cy="38" r="1"/><circle class="dk" cx="54" cy="38" r="1"/>', '<path class="nose" d="M50 41l11 3-11 2z"/>', '<path class="dk" d="M39 30h22M42 30V18h16v12z"/>'];
  return `<svg class="snow" viewBox="0 0 100 120" role="img" aria-label="Snowman, ${stage} of 8 parts built">${parts.slice(0, stage).join('')}</svg>`;
}
V.hang = () => {
  const setter = G.players[G.setter];
  let b;
  if (view.ph === 'hand') b = `<div class="center"><p class="lead">Hand the phone to</p><p class="big">${esc(setter)}</p><p class="lead">${esc(setter)} sets the word. Everyone else looks away.</p></div>` +
    `<button class="btn" data-act="hangType">Type a secret word</button><button class="btn alt" data-act="hangAuto">Let the phone choose, and everyone guesses</button>`;
  else if (view.ph === 'type') b = `<p class="tag">${esc(setter)}, type your word</p>` +
    `<input id="hw" type="text" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" data-enter="hangSet" aria-label="Secret word or short phrase">` +
    `<p class="muted">A word or short phrase, up to 24 letters.</p><button class="btn" data-act="hangSet">Hide it and start</button>`;
  else {
    const gs = hangGuessers(), who = gs[G.g % gs.length], left = G.max - G.wrong, letters = [...G.word];
    const word = `<div class="word" aria-label="The word so far">${letters.map(ch => ch === ' ' ? '<span class="sp"></span>' : `<span>${!isLetter(ch) || G.done || G.tried.includes(flat(ch)) ? esc(ch.toUpperCase()) : '&nbsp;'}</span>`).join('')}</div>`;
    const inWord = L => letters.some(ch => isLetter(ch) && flat(ch) === L);
    const head = G.done ? `<p class="tag ${G.solved ? 'good' : 'bad'}">${G.solved ? 'Solved' : 'The snowman is finished'}</p>` : `<p class="tag">${esc(who)}, pick a letter</p>`;
    b = `<div class="center">${head}${snowman(Math.ceil(G.wrong / G.max * 8))}</div>` + word +
      (G.done ? `<p class="lead" style="text-align:center">${G.solved ? 'The guessers get a point each.' : G.auto ? 'Nobody scores this time.' : esc(setter) + ' gets a point.'}</p>` +
          `<button class="btn" data-act="hangNext">Next word: ${esc(G.players[(G.setter + 1) % G.players.length])} sets it</button>` +
          `<button class="btn quiet" data-act="open" data-g="hang">Change players or settings</button>` + board('hang')
        : `<p class="muted" style="text-align:center">${left} wrong guess${left === 1 ? '' : 'es'} left</p>` +
          `<div class="keys">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L => `<button data-act="hangKey" data-k="${L}" class="${G.tried.includes(L) && inWord(L) ? 'ok' : ''}" ${G.tried.includes(L) ? 'disabled' : ''}>${L}</button>`).join('')}</div>`);
  }
  return page('Hangman', b, 'home', true);
};

/* Stop the clock */
const stopRange = () => S.level === 'easy' ? 2 : 3;
const stopPos = t => Math.max(3, Math.min(97, 50 + (t - G.target) / stopRange() * 50)).toFixed(1);
V.stopc = () => {

    `<button class="btn" style="min-height:120px" data-down="stopHit">Stop</button>`;

      `<div class="gauge"><i class="mid"></i><b class="mk" data-x="${stopPos(t)}"></b></div><div class="gends"><span>too early</span><span>${T}.00</span><span>too late</span></div></div>` +
      `<button class="btn" data-act="stopNext">${G.i + 1 < G.players.length ? 'Next: ' + esc(G.players[G.i + 1]) : 'See who was closest'}</button>`; }
  else { const rank = G.players.map((p, i) => ({p, i, t: G.times[i], d: Math.abs(G.times[i] - T)})).sort((a, c) => a.d - c.d);
    b = `<div class="center"><p class="tag good">${esc(rank[0].p)} was closest</p></div>` +
      rank.map(r => `<div class="grow"><span>${esc(r.p)}</span><div class="gauge"><i class="mid"></i><b class="mk" style="--pc:${COL[r.i % COL.length]}" data-x="${stopPos(r.t)}"></b></div><span>${r.t.toFixed(2)}</span></div>`).join('') +
      `<p class="muted">The green line is ${T}.00 seconds.</p>` + againBtns('stopc') + board('stopc'); }

/* Quick draw */
V.quick = () => {

  const cls = i => G.out.includes(i) ? (G.lastOut === i ? ' nope' : '') : st === 'done' && G.win >= 0 ? (i === G.win ? ' won' : ' lost') : '';
  const b = head + `<div class="pads big" style="--c:2">${G.players.map((p, i) => `<button class="pad2${cls(i)}" id="pd${i}" style="--pc:${COL[i]}" data-down="quickTap" data-i="${i}" ${G.out.includes(i) ? 'disabled' : ''}>${esc(p)}${G.out.includes(i) ? ' (too soon)' : ''}</button>`).join('')}</div>` +

/* ---------- game starters ---------- */
function startGame(type, players){
  if (type === 'imp') {
    const list = wordList();
    let fresh = list.filter(e => !used.has(e[0]));
    if (!fresh.length) { list.forEach(e => used.delete(e[0])); fresh = list; }
    const e = fresh[rnd(fresh.length)]; used.add(e[0]);
    const imp = rnd(players.length), mine = shuffle(impClues(e, players.length - 1));
    let ci = 0;
    G = {type, players, word: e[0], imp, starter: players[rnd(players.length)], scored: false,
      L: {t:'Imposter', who:'imposter', secret:'The word', key:'imp', talk:'Go around the circle. Each player says one thing about the word without giving it away.'},
      cards: players.map((name, i) => ({name, html: i === imp
        ? `<p class="tag bad">You are the imposter</p><p class="lead">You do not get the word. Your clue is</p><p class="big sm">${esc(e[2])}</p><p class="muted">Blend in, and try to work out the word.</p>`
        : `<p class="tag">The secret word</p><p class="big">${esc(e[0])}</p><p class="lead">${esc(mine[ci++ % mine.length])}</p><p class="muted">Nobody else has your clue. One player is an imposter who does not have the word.</p>`})),
      after: () => go('impTalk', {left: S.timer, total: S.timer, run: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'grinch') {
    const n = S.level === 'easy' ? 12 : 15, th = THEMES[S.theme] || THEMES.xmas, all = shuffle(th.items);
    G = {type, players, th, key: S.theme, shelf: all.slice(0, n), spare: all.slice(n), grinch: rnd(players.length), stolen: null,
      cards: players.map((name, i) => ({name, html: () => {
        const isG = i === G.grinch;
        return `<p class="tag ${isG ? 'bad' : 'good'}">You are ${isG ? th.thief : th.one}</p>` +
          `<p class="lead">${isG ? `Tap the ${th.thing} you want to steal.` : `Tap any ${th.thing} to ${th.nudge}. Everyone taps one, so ${th.thief} stays hidden.`}</p>` + shelfHTML(G.shelf, 'pickGift');
      }})),
      after: () => {
        G.rem = shuffle(G.shelf.filter((_, k) => k !== G.stolen));
        G.opts = shuffle([G.shelf[G.stolen]].concat(G.spare.slice(0, S.level === 'easy' ? 5 : 8)));
        go('grGuess', {pick: null});
      }};
    return go('grMem', {left: n === 12 ? 20 : 25});
  }
  if (type === 'wolf') {
    const n = players.length, w = n >= 11 ? 3 : n >= 7 ? 2 : 1;
    let roles = Array(w).fill('wolf');
    if (S.level === 'hard') { roles.push('seer'); if (n >= 5) roles.push('doctor'); }
    while (roles.length < n) roles.push('villager');
    roles = shuffle(roles);
    G = {type, players, roles, out: [],
      cards: players.map((name, i) => { const r = ROLE[roles[i]];
        const pack = players.filter((_, j) => j !== i && roles[j] === 'wolf');
        return {name, html: `<p class="huge" aria-hidden="true">${r[0]}</p><p class="big">${r[1]}</p><p class="lead">${r[2]}</p>` +
          (roles[i] === 'wolf' && pack.length ? `<p class="tag bad">Your pack: ${pack.map(esc).join(', ')}</p>` : '')}; }),
      after: () => go('wolf', {left: S.timer, total: S.timer, run: false, roles: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'spy') {
    const list = SPOTS[S.level];
    let fresh = list.filter(x => !used.has(x));
    if (!fresh.length) { list.forEach(x => used.delete(x)); fresh = list; }
    const place = fresh[rnd(fresh.length)]; used.add(place);
    const spy = rnd(players.length);
    G = {type, players, word: place, imp: spy, starter: players[rnd(players.length)], scored: false,
      L: {t:'Spot the spy', who:'spy', secret:'The place', key:'spy', list,
        talk:'Take turns asking each other questions about where you are. Answer without giving the place away.'},
      cards: players.map((name, i) => ({name, html: i === spy
        ? `<p class="tag bad">You are the spy</p><p class="lead">Everyone else knows where you all are. You do not.</p><p class="muted">Listen to the answers, work out the place, and do not get caught.</p>`
        : `<p class="tag">You are all at</p><p class="big">${esc(place)}</p><p class="muted">One player is a spy who does not know this. Answer questions without making it obvious.</p>`})),
      after: () => go('impTalk', {left: S.timer, total: S.timer, run: false})};
    return go('pass', {i: 0, shown: false, pick: null});
  }
  if (type === 'char') { G = {type, players, turn: 0, k: 0, deck: shuffle(wordList())}; return go('char', {ph: 'ready'}); }
  if (type === 'quiz') { G = {type, players, turn: 0, k: 0, deck: shuffle(QUIZ[S.level])}; return go('quiz', {ph: 'ask', opts: shuffle(G.deck[0].slice(1))}); }
  if (type === 'mlt') { G = {type, players, k: 0, deck: shuffle(MLT[S.level])}; return go('mlt', {who: null}); }
  if (type === 'wyr') { G = {type, players, k: 0, deck: shuffle(WYR[S.level])}; return go('wyr', {votes: []}); }
  if (type === 'num') { G = {type, players, chooser: 0, g: 0, tried: [], secret: null, max: S.level === 'easy' ? 20 : 50}; return go('num', {ph: 'hand', pick: null}); }
  if (type === 'agent') { const hard = S.level === 'hard'; G = {type, players, chooser: 0, g: 0, tries: 0, cols: hard ? 5 : 4, rows: hard ? 6 : 5, cells: null, pos: null}; return go('agent', {ph: 'hand', pick: null}); }
  if (type === 'oxo' || type === 'four') { G = {type, pair: [players[0], players[1]], bench: players.slice(2)}; gridNew(); return go('grid', {}); }
  if (type === 'rps') { G = {type, pair: [players[0], players[1]], bench: players.slice(2), target: S.level === 'easy' ? 3 : 5, sc: [0, 0], picks: []}; return go('rps', {ph: 'pick'}); }
  if (type === 'pairs') {
    const n = S.level === 'easy' ? 6 : 10, pick = shuffle(GIFTS).slice(0, n);
    G = {type, players, turn: 0, open: [], lock: false, got: {}, done: false, winners: [], cards: shuffle(pick.concat(pick)).map(e => ({e, up: false, gone: false}))};
    return go('pairs', {});
  }
  if (type === 'hang') { G = {type, players, setter: 0, word: '', tried: [], wrong: 0, g: 0, max: S.level === 'easy' ? 8 : 6, auto: false, done: false}; return go('hang', {ph: 'hand'}); }
  if (type === 'fire') { G = {type, players}; fireNew(); return go('fire', {}); }
  if (type === 'pump') { const easy = S.level === 'easy'; G = {type, players, turn: 0, size: 0, pop: easy ? 6 + rnd(10) : 10 + rnd(21), done: false}; bpReset(); return go('pump', {}); }
  if (type === 'stopc') { const easy = S.level === 'easy'; G = {type, players, i: 0, times: [], target: easy ? 5 : 10, hide: easy ? 3 : 2}; return go('stopc', {ph: 'ready'}); }
  if (type === 'quick') { G = {type, players, out: [], state: 'idle', win: -1, ms: 0, round: (G && G.round || 0) + 1}; return go('quick', {}); }
  if (type === 'who') {
    G = {type, players, turn: 0, k: 0, deck: shuffle(WHO[S.level])};
    return go('who', {ph: 'ready', q: 0});
  }
  if (type === 'tod') {
    G = {type, players: shuffle(players), turn: 0, deck: {truth: shuffle(TOD[S.level].truth), dare: shuffle(TOD[S.level].dare)}, at: {truth: 0, dare: 0}};
    return go('tod', {});
  }
}

/* ---------- actions ---------- */
const A = {};

// Sparks, smoke, bursts and confetti are drawn on one canvas laid over the whole screen.
const FX = {p: [], raf: 0, last: 0};
const calm = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = () => Math.random();
const CONF = ['#FF6B6B', '#FFD166', '#6BCB77', '#4D96FF', '#C77DFF', '#FFFFFF'];

      if (q.crk) for (let k = 0; k < 3; k++) { const an = R() * 6.283, sp = 30 + R() * 50; born.push({k: 'star', x: q.x, y: q.y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, g: 40, d: .93, life: 0, max: .2 + R() * .25, c: '#FFFFFF', s: 1 + R(), tw: true, ph: R() * 6}); }
      return false;
    }
    const drag = Math.pow(q.d, dt * 60); q.vx *= drag; q.vy = q.vy * drag + q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    const a = 1 - q.life / q.max;
    ctx.globalCompositeOperation = 'source-over';
    if (q.k === 'smoke') { ctx.globalAlpha = a * .3; ctx.fillStyle = q.c || '#C9D2DC'; ctx.beginPath(); ctx.arc(q.x, q.y, q.s * (1 + q.life * 2.5), 0, 7); ctx.fill(); return true; }
    if (q.k === 'conf') { q.r += q.vr * dt; ctx.globalAlpha = Math.min(1, a * 3); ctx.fillStyle = q.c; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.scale(1, Math.cos(q.r * 1.7)); ctx.fillRect(-q.s, -q.s / 2, q.s * 2, q.s); ctx.restore(); return true; }

    return true;
  });

}

const fxCenter = el => { if (!el) return null; const b = el.getBoundingClientRect(); return {x: b.left + b.width / 2, y: b.top + b.height / 2}; };
function pulse(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function fxSpot(i, pct){

  const target = pumpScale(BP.vis) * (BP.pre > 0 ? 1.24 : 1);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);

  ctx.globalAlpha = .9; ctx.fillStyle = '#FFE28A'; ctx.beginPath(); ctx.arc(w * .86, h * .13, 20 + Math.sin(T * 1.3) * 1.2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  if (!BP.cl.length) BP.cl = [{x: .15, y: .14, s: 1}, {x: .6, y: .26, s: .75}, {x: .95, y: .08, s: .6}];

    [[-1.1, .2, .8], [0, 0, 1.15], [1.1, .25, .85], [.2, .45, 1]].forEach(o => { ctx.beginPath(); ctx.arc(x + o[0] * r, y + o[1] * r, r * o[2], 0, 7); ctx.fill(); }); });
  ctx.globalAlpha = 1;
  if (!BP.bg.length) for (let k = 0; k < 7; k++) BP.bg.push({x: R() * w, y: R() * h, c: CONF[k % 5], s: .6 + R() * .6, ph: R() * 6, vx: 0, vy: 0});
  BP.bg.forEach(b => { if (!quiet) { b.y += (b.vy - (12 + b.s * 10)) * dt; b.x += (Math.sin(T * .9 + b.ph) * 9 + b.vx) * dt; b.vx *= Math.pow(.96, dt * 60); b.vy *= Math.pow(.95, dt * 60); }
    if (b.y < -40) { b.y = ground + 20 + R() * 40; b.x = R() * w; b.vx = 0; }
    if (b.y < ground + 10) bpBalloon(ctx, b.x, b.y, 8 * b.s, 10 * b.s, b.c, .7); });
  const flags = 9; ctx.strokeStyle = 'rgba(18,51,43,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 8); ctx.quadraticCurveTo(w / 2, 40, w, 8); ctx.stroke();

  const px = w * .15, nx = w / 2, ny = h - 34, press = BP.pulse >= 0 ? Math.sin(Math.min(1, BP.pulse * 1.6) * Math.PI) : 0;

  ctx.lineCap = 'round'; ctx.strokeStyle = '#2B3A42'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(px, h - 16); ctx.bezierCurveTo(px + 40, h + 6, nx - 50, h + 4, nx, h - 18); ctx.stroke();
  if (BP.pulse >= 0) { const u = BP.pulse, a = 1 - u, bx = a * a * a * px + 3 * a * a * u * (px + 40) + 3 * a * u * u * (nx - 50) + u * u * u * nx, by = a * a * a * (h - 16) + 3 * a * a * u * (h + 6) + 3 * a * u * u * (h + 4) + u * u * u * (h - 18);
    ctx.fillStyle = '#2B3A42'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#5B7C8D'; ctx.fillRect(px - 10, h - 64, 20, 50); ctx.fillStyle = '#2B3A42'; ctx.fillRect(px - 16, h - 16, 32, 7);
  ctx.strokeStyle = '#C9D2DC'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(px, h - 64); ctx.lineTo(px, h - 92 + press * 22); ctx.stroke();
  ctx.strokeStyle = '#2B3A42'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(px - 15, h - 92 + press * 22); ctx.lineTo(px + 15, h - 92 + press * 22); ctx.stroke();
  ctx.fillStyle = '#2B3A42'; ctx.fillRect(nx - 6, ny, 12, 18);

  if (!BP.burst) {
    const grow = bpClamp((BP.s - 1) / 2.1, 0, 1), sq = bpClamp(BP.v * .04, -.15, .15), R0 = 25 * Math.max(.2, BP.s), rx = R0 * (1 - sq), ry = R0 * 1.17 * (1 + sq), neck = 7 + R0 * .08;

    ctx.fillStyle = '#B3202B'; ctx.beginPath(); ctx.moveTo(-4, ry - 2); ctx.lineTo(4, ry - 2); ctx.lineTo(5, ry + neck + 2); ctx.lineTo(-5, ry + neck + 2); ctx.closePath(); ctx.fill();
    const gr = ctx.createRadialGradient(-rx * .35, -ry * .38, R0 * .05, 0, 0, Math.max(rx, ry) * 1.15);
    gr.addColorStop(0, '#FFC2C7'); gr.addColorStop(.35 + grow * .2, grow > .5 ? '#F0606B' : '#E63946'); gr.addColorStop(1, '#9E1B22');
    ctx.globalAlpha = 1 - grow * .1; ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 7); ctx.fill();
    if (BP.rip >= 0) { BP.rip += dt / .45; if (BP.rip >= 1) BP.rip = -1; else { ctx.globalAlpha = (1 - BP.rip) * .45; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, ry * (1 - BP.rip) * .6, rx * (.3 + .7 * BP.rip), ry * (.3 + .7 * BP.rip), 0, 0, 7); ctx.stroke(); } }
    if (grow > .4) { ctx.globalAlpha = (grow - .4) * .5; ctx.strokeStyle = '#FFD0D4'; ctx.lineWidth = 1.2; [-.55, .5].forEach(o => { ctx.beginPath(); ctx.ellipse(rx * o, 0, rx * .32, ry * .8, 0, -1.1, 1.1); ctx.stroke(); }); }
    ctx.globalAlpha = .5; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-rx * .4, -ry * .42 + Math.sin(T * 1.6) * 1.2, rx * .15, ry * .27, -.5, 0, 7); ctx.fill();
    ctx.globalAlpha = .35; ctx.beginPath(); ctx.arc(-rx * .12, -ry * .72, rx * .05, 0, 7); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    if (amp > 1.1) { ctx.strokeStyle = 'rgba(18,51,43,.45)'; ctx.lineWidth = 2; const pu = .5 + .5 * Math.sin(T * 14);

}
const bpStart = () => { if (!BP.raf) { BP.last = performance.now(); BP.raf = requestAnimationFrame(bpLoop); } };

// balloon pump
A.pumpGo = el => {
  if (G.done || G.popping) return;
  const k = +el.dataset.k, name = G.players[G.turn % G.players.length];
  if (G.size + k < G.pop) { G.size += k; G.turn++; BP.queue += k; }
  else { BP.queue += G.pop - G.size; G.size = G.pop; G.popping = true; G.loser = name; }   // the scene plays the last pumps, then bursts
  render();
};

// stop the clock
A.stopGo = () => {
  view.ph = 'run'; render(); G.t0 = performance.now();
  const arc = document.getElementById('darc'), dial = document.getElementById('dial'), c = document.getElementById('clock');
  tick = setInterval(() => {
    const e = (performance.now() - G.t0) / 1000;
    if (e < G.hide) { if (c) c.textContent = e.toFixed(2); if (arc) arc.style.strokeDashoffset = (339.3 * (1 - e / G.target)).toFixed(1); }
    else if (dial && !dial.classList.contains('hid')) { dial.classList.add('hid'); if (c) c.textContent = '?.??'; }
  }, 30);
};
A.stopHit = () => {
  if (view.ph !== 'run') return;
  const t = G.times[G.i] = (performance.now() - G.t0) / 1000; clearInterval(tick); tick = null; view.ph = 'shown'; render();
  if (Math.abs(t - G.target) < .15) fxConfetti({x: window.innerWidth / 2, y: window.innerHeight * .4}, Math.abs(t - G.target) < .05 ? 110 : 50);
};
A.stopNext = () => {
  if (G.i + 1 < G.players.length) { G.i++; return go('stopc', {ph: 'ready'}); }
  let best = 0; G.times.forEach((t, i) => { if (Math.abs(t - G.target) < Math.abs(G.times[best] - G.target)) best = i; });
  const n = G.players[best]; pts('stopc')[n] = (pts('stopc')[n] || 0) + 1; save(); go('stopc', {ph: 'end'});
  fxRain(80, [COL[best % COL.length], '#FFD166', '#FFFFFF']);
};

// quick draw
A.quickStart = () => {
  const round = G.round, alive = () => view.n === 'quick' && G && G.type === 'quick' && G.round === round && G.state !== 'done';
  let fakes = S.level === 'hard' ? 1 + rnd(2) : 0;
  const step = () => {
    tick = setTimeout(() => {
      if (!alive()) return;
      G.lastOut = -1;
      if (fakes > 0) { fakes--; G.state = 'fake'; render(); tick = setTimeout(() => { if (!alive()) return; G.state = 'wait'; render(); step(); }, 550); }
      else { G.state = 'go'; G.t0 = performance.now(); buzz1(); render(); fxRings(fxCenter(document.getElementById('sig')), '#3DDC84', 3); }
    }, 1600 + rnd(3200));
  };
  G.state = 'wait'; G.lastOut = -1; render(); step();
};
A.quickTap = el => {
  const i = +el.dataset.i, st = G.state;
  if (st === 'idle' || st === 'done' || G.out.includes(i)) return;
  G.lastOut = -1;
  if (st === 'go') {
    G.ms = Math.round(performance.now() - G.t0); G.win = i; G.state = 'done'; const n = G.players[i]; pts('quick')[n] = (pts('quick')[n] || 0) + 1; save(); render();
    const o = fxCenter(document.getElementById('pd' + i)); fxConfetti(o, 90, [COL[i], '#FFD166', '#FFFFFF']); fxRings(o, COL[i], 2);
    return;
  }

// truth or dare
A.todPick = el => { const k = el.dataset.kind, d = G.deck[k]; view.kind = k; view.text = d[G.at[k] % d.length]; G.at[k]++; render(); };

/* change handlers */
const C = {};
C.limit = el => { S.santa.limit = el.value.replace(/[^0-9.]/g, ''); el.value = S.santa.limit; save(); };
C.cat = el => { S.cat = el.value; save(); };
C.timer = el => { S.timer = +el.value; save(); };
C.import = el => {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);

/* ---------- wiring ---------- */
function holdDone(){
  if (view.n === 'pass') { view.shown = true; if (G.onShown) G.onShown(); render(); window.scrollTo(0, 0); }
  else if (view.n === 'wolf') { view.roles = true; render(); }
}
function after(){
  const h = document.getElementById('hold');

    // Letting go early winds them back down.
    const ring = h.querySelector('.rng'), lab = h.querySelector('.hl'), HOLD = 2000, LEN = 289;

    view.left--;

    const c = document.getElementById('clock'); if (c) c.textContent = mmss(view.left);

document.addEventListener('click', e => {
